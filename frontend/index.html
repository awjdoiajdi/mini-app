  <style>
    :root{
      --bg:#07070a;--ink:#f7f7f2;--muted:#a2a2a8;--soft:#707078;--panel:rgba(18,18,22,.78);--panel2:#101014;--white:#fff;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.2);--bad:#ff7070;--ok:#7ee4a5;--warn:#f5c96a;--nav:84px;--safe:env(safe-area-inset-bottom,0px);--shadow:0 30px 90px rgba(0,0,0,.42)

    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.panel,.task,.recipe,.inbox-item{border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.065);box-shadow:0 18px 52px rgba(0,0,0,.22);backdrop-filter:blur(18px)}.card{padding:16px}.card span,.metric span{display:block;color:var(--soft);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.09em}.card b,.metric b{display:block;margin-top:7px;font-size:30px;letter-spacing:-.06em}.card small{display:block;margin-top:6px;color:var(--muted);line-height:1.38}.score{height:8px;margin-top:12px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}.score i{display:block;height:100%;border-radius:inherit;background:#fff}.section{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 12px}.section h2{font-size:22px;letter-spacing:-.055em}.section span{color:var(--soft);font-size:12px;font-weight:900}.panel{padding:16px}.empty{display:grid;place-items:center;gap:8px;min-height:132px;padding:22px;border:1px dashed rgba(255,255,255,.22);border-radius:28px;background:rgba(255,255,255,.035);text-align:center;color:var(--muted)}.empty b{color:var(--ink);font-size:18px}

    .fridge-wrap{position:relative;min-height:220px;margin-top:14px;border-radius:34px;border:1px solid var(--line2);background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.035));overflow:hidden;box-shadow:var(--shadow)}.fridge{position:absolute;right:26px;top:18px;width:118px;height:166px;border-radius:30px 30px 22px 22px;background:linear-gradient(145deg,#f8f8f2,#8a8a92);box-shadow:inset 12px 12px 28px rgba(255,255,255,.62),inset -18px -24px 34px rgba(0,0,0,.34),0 34px 70px rgba(0,0,0,.45);transform:perspective(600px) rotateY(-13deg);animation:float 7s ease-in-out infinite}.fridge:before{content:"";position:absolute;left:13px;right:13px;top:60px;height:1px;background:rgba(0,0,0,.18)}.fridge:after{content:"";position:absolute;right:15px;top:27px;width:7px;height:42px;border-radius:999px;background:rgba(0,0,0,.32)}.fridge-shadow{position:absolute;right:26px;top:184px;width:128px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(12px)}.fridge-copy{position:relative;z-index:1;max-width:58%;padding:24px 18px}.fridge-copy h2{font-size:34px;line-height:.98;letter-spacing:-.07em}.fridge-copy p{margin-top:10px;color:#c9c9d0;line-height:1.5}.photo{display:block;margin-top:10px;padding:14px;border:1px dashed var(--line2);border-radius:22px;background:rgba(255,255,255,.055);color:#fff;font-weight:900;text-align:center}.recipe{padding:15px}.recipe h3{font-size:19px;letter-spacing:-.04em}.recipe p,.recipe li{color:#cacad1;line-height:1.45}.recipe ul,.recipe ol{padding-left:20px;margin-top:8px}.recipe-top{display:flex;align-items:start;justify-content:space-between;gap:10px}.cook-step{padding:14px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.06)}
    .modal{position:fixed;inset:0;z-index:90;display:grid;align-items:end;background:rgba(0,0,0,.58);backdrop-filter:blur(10px)}.sheet{width:min(100%,760px);max-height:88dvh;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;border-radius:32px 32px 0 0;background:#101014;border:1px solid var(--line);padding:12px 16px calc(22px + var(--safe));box-shadow:0 -30px 90px rgba(0,0,0,.58)}.handle{width:48px;height:5px;margin:0 auto 14px;border-radius:999px;background:#33333a}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.sheet-head span{display:block;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.09em}.sheet-head h2{font-size:28px;letter-spacing:-.055em}.close{width:44px;height:44px;border-radius:16px;background:rgba(255,255,255,.08);font-size:24px;font-weight:900}.field{display:grid;gap:8px;margin-bottom:12px}.field label{color:var(--soft);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.09em}.input{min-height:50px;padding:13px 15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result-list{display:grid;gap:9px}.result-row{display:grid;grid-template-columns:auto 1fr;align-items:start;gap:10px;padding:11px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid var(--line)}.result-row span{color:var(--muted);line-height:1.4}.loading{display:grid;place-items:center;gap:12px;min-height:180px;color:var(--muted);text-align:center}.loader{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#fff;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

<body>
  <div class="app">
    <header class="top"><div class="brand"><div class="logo">D</div><div><b>DailyOS</b><span><i></i><em id="sync-status">local first</em></span></div></div><button class="profile" id="avatar" data-action="settings" aria-label="Память">D</button></header>
    <main id="view"></main>
  </div>
  <button class="fab" data-action="task-new" aria-label="Новая задача">+</button>
  <nav class="nav" aria-label="Навигация">
    <button class="active" data-view="home"><b>✦</b><span>Главная</span></button>
    <button data-view="inbox"><b>▦</b><span>Входящие</span></button>
    <button data-view="food"><b>◒</b><span>Еда</span></button>
    <button data-view="memory"><b>◌</b><span>Память</span></button>
  </nav>
  <div id="modal-root"></div><div id="toast" class="toast" role="status"></div><input id="import-file" class="hidden" type="file" accept="application/json"><input id="food-photo" class="hidden" type="file" accept="image/*" capture="environment">
  <script>
    const TG=window.Telegram?.WebApp;TG?.ready();TG?.expand();TG?.setHeaderColor?.('#07070a');TG?.setBackgroundColor?.('#07070a');
    const USER=TG?.initDataUnsafe?.user,USER_ID=String(USER?.id||'guest'),KEY=`dailyos.ai.v5.${USER_ID}`,OLD4=`dailyos.black.v4.${USER_ID}`,OLDCHAT=`dailyos.chat.v1.${USER_ID}`;
    const API_BASE=/^(dailyos\.onrender\.com|localhost|127\.0\.0\.1)$/.test(location.hostname)?'':'https://dailyos.onrender.com';
    const PR={high:'Высокий',medium:'Средний',low:'Низкий'},CATS=['Работа','Личное','Здоровье','Учёба','Дом','Покупки','Еда','Другое'];
    const MODES={today:'Сегодня',rescue:'Спаси день',now:'Что сейчас',inbox:'Входящие',food:'Еда',mini:'Мини-версия',ideas:'Идеи'};
    let view='home',activeTaskFilter='open',toastTimer,aiHealth={ai:false,provider:'groq'},sync='local',aiResult=null,editing=null;
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
    const day=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>day(),addDays=(date,n)=>{const d=new Date(`${date}T12:00:00`);d.setDate(d.getDate()+n);return day(d)},fmt=date=>date===today()?'Сегодня':date===addDays(today(),1)?'Завтра':new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(`${date}T12:00:00`));

    function saveMsgRecipe(id){const m=current().messages.find(x=>x.id===id);if(!m?.recipe)return;state.recipes.unshift(normalizeRecipe(m.recipe));save();tap('success');toast('Рецепт сохранён');view='food';render()}
    function applyMsgPlan(id){const m=current().messages.find(x=>x.id===id),plan=Array.isArray(m?.plan)?m.plan:[];let changed=0;for(const x of plan){const t=state.tasks.find(t=>t.id===x.taskId);if(!t)continue;if(x.delete){state.tasks=state.tasks.filter(z=>z.id!==t.id);changed++;continue}if(/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')){t.date=x.date;changed++}if(/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time||'')){t.time=x.time;changed++}if(x.done===true){t.done=true;t.completedAt=Date.now();changed++}}save();tap('success');toast(`Изменено: ${changed}`);render()}
    async function captureAI(text,source='text'){text=text.trim();if(!text)return toast('Нет текста');loading('AI-разбор','Достаю задачи, даты и покупки...');try{aiResult=await callAI('capture',{text,today:today(),currentTime:new Date().toTimeString().slice(0,5)});const tasks=Array.isArray(aiResult.tasks)?aiResult.tasks.slice(0,14):[];openModal(`<div class="sheet-head"><div><span>AI-разбор</span><h2>Подтверди</h2></div><button class="close" data-action="close">×</button></div><div class="result-list">${tasks.map((t,i)=>`<label class="result-row"><input type="checkbox" data-ai-task="${i}" checked><span><b>${esc(t.title)}</b><br>${esc(t.date||today())} · ${Number(t.duration)||30} мин · ${esc(PR[t.priority]||PR.medium)}</span></label>`).join('')||empty('Не нашёл задач','Попробуй написать конкретнее.')}</div>${tasks.length?`<button class="primary" style="width:100%;margin-top:12px" data-action="import-ai" data-source="${esc(source)}">Добавить выбранное</button>`:''}`)}catch(e){closeModal();toast(e.message)}}
    function importAI(source){const items=Array.isArray(aiResult?.tasks)?aiResult.tasks:[],chosen=$$('[data-ai-task]:checked').map(x=>items[Number(x.dataset.aiTask)]).filter(Boolean);for(const t of chosen)state.tasks.unshift(normalizeTask({...t,source}));save();closeModal();tap('success');toast(`Добавлено: ${chosen.length}`);view='inbox';render()}
    async function cookText(text){text=text.trim();if(!text)return toast('Напиши продукты');loading('Холодильник','Придумываю блюда из твоих продуктов...');try{const res=await callAI('recipe',{text,today:today(),memory:state.memory,recipes:state.recipes.slice(0,6)});const recipes=(res.recipes||[]).slice(0,3).map(normalizeRecipe);openModal(`<div class="sheet-head"><div><span>Холодильник</span><h2>Что приготовить</h2></div><button class="close" data-action="close">×</button></div><p style="color:var(--muted);line-height:1.5;margin-bottom:12px">${esc(res.message||'Выбери блюдо.')}</p><div class="recipe-list">${recipes.map((r,i)=>recipeChoiceHTML(r,i)).join('')}</div>`);aiResult={recipes}}catch(e){closeModal();toast(e.message)}}
    function recipeChoiceHTML(r,i){return`<article class="recipe"><h3>${esc(r.title)}</h3><div class="meta"><span class="pill">${esc(r.time)}</span><span class="pill">${esc(r.difficulty)}</span>${r.calories?`<span class="pill">${esc(r.calories)}</span>`:''}</div>${r.shopping.length?`<div class="mini">Докупить: ${esc(r.shopping.join(', '))}</div>`:''}<button class="primary" style="width:100%;margin-top:12px" data-action="save-recipe" data-index="${i}">Сохранить</button></article>`}
    async function cookPhoto(file){if(!file)return;loading('Фото продуктов','Распознаю продукты и подбираю блюда...');try{const fd=new FormData();fd.append('photo',file);const r=await api('/api/fridge/photo',{method:'POST',headers:{'X-Telegram-Init-Data':TG?.initData||''},body:fd});if(!r.ok)throw new Error(await r.text()||'Фото не распознано');const res=(await r.json()).result,recipes=(res.recipes||[]).slice(0,3).map(normalizeRecipe);openModal(`<div class="sheet-head"><div><span>Холодильник</span><h2>По фото</h2></div><button class="close" data-action="close">×</button></div><p style="color:var(--muted);line-height:1.5;margin-bottom:12px">${esc(res.message||'Нашёл продукты.')}</p><div class="recipe-list">${recipes.map((r,i)=>recipeChoiceHTML(r,i)).join('')}</div>`);aiResult={recipes}}catch(e){closeModal();toast(e.message)}}
    function saveRecipe(i){const r=aiResult?.recipes?.[Number(i)];if(!r)return;state.recipes.unshift(normalizeRecipe(r));save();closeModal();tap('success');toast('Рецепт сохранён');render()}
    function cookSteps(id){const r=state.recipes.find(x=>x.id===id);if(!r)return;openModal(`<div class="sheet-head"><div><span>Режим готовки</span><h2>${esc(r.title)}</h2></div><button class="close" data-action="close">×</button></div><div class="result-list">${(r.steps.length?r.steps:['Подготовь продукты','Готовь по базовому рецепту','Попробуй и поправь соль']).map((s,i)=>`<div class="cook-step"><b>Шаг ${i+1}</b><p style="margin-top:6px;color:var(--muted);line-height:1.45">${esc(s)}</p></div>`).join('')}</div><button class="secondary" style="width:100%;margin-top:12px" data-mode="food">Спросить замену продукта</button>`)}
    function taskForm(t={}){editing=t.id||null;const v={title:'',notes:'',date:today(),time:'',duration:30,category:'Личное',priority:'medium',...t};openModal(`<div class="sheet-head"><div><span>${editing?'Редактирование':'Новая задача'}</span><h2>Задача</h2></div><button class="close" data-action="close">×</button></div><form id="task-form"><div class="field"><label>Название</label><input class="input" id="task-title" maxlength="120" required value="${esc(v.title)}" placeholder="Что сделать?"></div><div class="field"><label>Контекст</label><textarea class="input" id="task-notes" maxlength="900" placeholder="Детали, ссылки, критерий готовности">${esc(v.notes)}</textarea></div><div class="form-grid"><div class="field"><label>Дата</label><input class="input" id="task-date" type="date" value="${esc(v.date)}"></div><div class="field"><label>Время</label><input class="input" id="task-time" type="time" value="${esc(v.time)}"></div></div><div class="form-grid"><div class="field"><label>Минуты</label><input class="input" id="task-duration" type="number" min="5" max="480" step="5" value="${v.duration}"></div><div class="field"><label>Категория</label><select class="input" id="task-category">${CATS.map(c=>`<option ${v.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label>Приоритет</label><select class="input" id="task-priority">${Object.entries(PR).map(([k,l])=>`<option value="${k}" ${v.priority===k?'selected':''}>${l}</option>`).join('')}</select></div><button class="primary" style="width:100%;margin-top:8px" type="submit">Сохранить</button>${editing?`<button class="danger" style="width:100%;margin-top:10px" type="button" data-action="task-delete" data-id="${esc(editing)}">Удалить</button>`:''}</form>`)}
    function saveTask(){const title=$('#task-title').value.trim();if(!title)return toast('Назови задачу');const old=state.tasks.find(t=>t.id===editing),task=normalizeTask({id:old?.id,title,notes:$('#task-notes').value.trim(),date:$('#task-date').value||today(),time:$('#task-time').value,duration:$('#task-duration').value,category:$('#task-category').value,priority:$('#task-priority').value,source:old?.source||'manual',done:old?.done,createdAt:old?.createdAt,completedAt:old?.completedAt,subtasks:old?.subtasks||[]});if(old)state.tasks[state.tasks.indexOf(old)]=task;else state.tasks.unshift(task);save();closeModal();tap('success');toast(old?'Обновлено':'Создано');render()}
    function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?Date.now():null;save();tap(t.done?'success':'select');render()}
    function addMemory(){openModal(`<div class="sheet-head"><div><span>Память</span><h2>Новое правило</h2></div><button class="close" data-action="close">×</button></div><form id="memory-form"><div class="field"><label>Что помнить</label><textarea class="input" id="memory-text" maxlength="300" placeholder="Например: вечером не ставить тяжёлые задачи"></textarea></div><button class="primary" style="width:100%">Сохранить</button></form>`)}
    function saveMemory(){const x=$('#memory-text').value.trim();if(!x)return;state.memory.notes.unshift(x);state.memory.notes=state.memory.notes.slice(0,20);save();closeModal();toast('Запомнил');render()}
    function settings(){openModal(`<div class="sheet-head"><div><span>Настройки</span><h2>DailyOS</h2></div><button class="close" data-action="close">×</button></div><form id="settings-form"><div class="field"><label>Энергия сегодня</label><select class="input" id="set-energy"><option value="low" ${state.memory.energy==='low'?'selected':''}>Мало</option><option value="medium" ${state.memory.energy==='medium'?'selected':''}>Нормально</option><option value="high" ${state.memory.energy==='high'?'selected':''}>Много</option></select></div><div class="field"><label>Рабочее время</label><input class="input" id="set-hours" value="${esc(state.memory.hours)}" placeholder="09:00-20:00"></div><button class="primary" style="width:100%">Сохранить</button></form>`)}
    function saveSettings(){state.memory.energy=$('#set-energy').value;state.memory.hours=$('#set-hours').value.trim().slice(0,40)||'09:00-20:00';save();closeModal();toast('Настройки сохранены');render()}
    function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dailyos-data.json';a.click();URL.revokeObjectURL(a.href)}
    function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state=revive(JSON.parse(r.result));save();render();toast('Импорт готов')}catch(_){toast('Файл не похож на DailyOS')}};r.readAsText(file)}
    async function bootCapture(){const p=new URLSearchParams(location.search),id=p.get('capture_id'),old=p.get('capture');if(old){captureAI(old,'telegram');history.replaceState(null,'','/');return}if(!id)return;try{const r=await api(`/api/capture/${encodeURIComponent(id)}`,{headers:{'X-Telegram-Init-Data':TG?.initData||''}});if(!r.ok)throw new Error(await r.text());const data=await r.json();history.replaceState(null,'','/');captureAI(data.text,'telegram')}catch(e){toast(e.message)}}
    document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const x=$('#chat-text');sendChat(x.value);x.value=''}if(e.target.id==='capture-form'){e.preventDefault();captureAI($('#capture-text').value,'manual')}if(e.target.id==='food-form'){e.preventDefault();cookText($('#food-text').value)}if(e.target.id==='task-form'){e.preventDefault();saveTask()}if(e.target.id==='memory-form'){e.preventDefault();saveMemory()}if(e.target.id==='settings-form'){e.preventDefault();saveSettings()}});
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(b.dataset.view){view=b.dataset.view;tap();render();scrollTo(0,0)}if(b.dataset.mode){tap();startMode(b.dataset.mode)}if(b.dataset.thread){state.activeThread=b.dataset.thread;view='home';save();render()}if(a==='new-chat'){const t=thread('today','Новый чат','Чем помочь?');state.threads.unshift(t);state.activeThread=t.id;save();render()}if(a==='close')closeModal();if(a==='task-new')taskForm();if(a==='task-edit')taskForm(state.tasks.find(t=>t.id===b.dataset.id));if(a==='task-toggle')toggleTask(b.dataset.id);if(a==='task-delete'){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.id);save();closeModal();render()}if(a==='import-msg-tasks')importMsgTasks(b.dataset.id);if(a==='save-msg-recipe')saveMsgRecipe(b.dataset.id);if(a==='apply-msg-plan')applyMsgPlan(b.dataset.id);if(a==='import-ai')importAI(b.dataset.source);if(a==='food-photo')$('#food-photo').click();if(a==='save-recipe')saveRecipe(b.dataset.index);if(a==='cook')cookSteps(b.dataset.id);if(a==='memory-add')addMemory();if(a==='settings')settings();if(a==='export-data')exportData();if(a==='import-data')$('#import-file').click();if(a==='clear-data'&&confirm('Удалить локальные данные DailyOS?')){localStorage.removeItem(KEY);state=blank();save();render()}});
    document.addEventListener('change',e=>{if(e.target.id==='import-file')importData(e.target.files[0]);if(e.target.id==='food-photo')cookPhoto(e.target.files[0]);if(e.target.dataset.filter){activeTaskFilter=e.target.dataset.filter;render()}});
    document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){activeTaskFilter=f.dataset.filter;render()}});
    api('/health').then(r=>r.json()).then(x=>{aiHealth=x;setStatus();render()}).catch(()=>setStatus());render();bootCloud();bootCapture();
  </script>
</body>
</html>
