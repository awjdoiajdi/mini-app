    .app{width:min(100%,760px);min-height:100dvh;margin:auto;padding-bottom:calc(var(--nav) + var(--safe) + 24px)}.page{padding:calc(18px + env(safe-area-inset-top,0px)) 16px 0}.page-head{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:126px;margin-bottom:16px;padding:20px 120px 20px 20px;overflow:hidden;border-radius:26px;background:#111;color:#fff}.page-head h1{font-size:34px;line-height:1;letter-spacing:-.06em}.page-head p{margin-top:7px;color:#aaa;font-size:13px}.page-head .ring3d{border-color:rgba(255,255,255,.25)}.page-head .shadow3d{background:rgba(255,255,255,.12)}.add{width:38px;height:38px;border:1px solid #333;border-radius:13px;background:#fff;color:#111;font-size:22px;box-shadow:var(--shadow)}
     .mark{position:absolute;right:22px;top:22px;width:78px;height:78px;display:flex;align-items:center;justify-content:center;gap:5px;pointer-events:none}.mark i{display:block;width:5px;height:28px;border-radius:5px;background:#fff;opacity:.95;animation:signal 1.8s ease-in-out infinite}.mark i:nth-child(1){height:18px;animation-delay:-.6s}.mark i:nth-child(2){height:38px;animation-delay:-.3s}.mark i:nth-child(3){height:25px}@keyframes signal{0%,100%{transform:scaleY(.65);opacity:.45}50%{transform:scaleY(1);opacity:1}}

    .task-list,.recipe-list,.result-list{display:grid}.task,.recipe,.setting-row{border-bottom:1px solid var(--line);background:transparent}.task{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;min-height:62px}.task.done{opacity:.45}.check{width:25px;height:25px;border:1.5px solid #bbb;border-radius:50%;color:transparent;font-size:13px}.task.done .check{background:#111;color:#fff;border-color:#111}.task-title{font-size:14px;font-weight:750;line-height:1.35}.task.done .task-title{text-decoration:line-through}.task-main{text-align:left}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;color:var(--muted);font-size:11px}.pill{display:inline-flex;align-items:center}.pill.high{color:var(--bad)}.date{text-align:right;color:var(--muted);font-size:11px}.date b{display:block;color:var(--ink);font-size:13px}.section{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px}.section h2{font-size:18px;letter-spacing:-.04em}.section span{color:var(--muted);font-size:12px}.empty{display:grid;place-items:center;gap:6px;min-height:120px;padding:18px;text-align:center;color:var(--muted);font-size:13px}.empty b{color:var(--ink);font-size:16px}
    .quick{margin-bottom:18px}.quick label{display:block;margin:0 2px 7px;color:var(--muted);font-size:11px;font-weight:800}.quick-row{display:grid;grid-template-columns:1fr auto;gap:7px;padding:6px;border:1px solid var(--line);border-radius:19px;background:#fff}.quick textarea{min-height:48px;padding:12px;border:0;background:transparent}.quick button{width:44px;border-radius:14px;background:#111;color:#fff;font-size:19px}.food-actions{display:grid;grid-template-columns:1fr auto;gap:8px}.camera{width:48px;height:48px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:18px}.recipe{padding:13px 0}.recipe h3{font-size:15px}.recipe p{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.45}.recipe-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.mini{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.4}
    .profile-name{margin:2px 0 20px}.profile-name h2{font-size:24px;letter-spacing:-.05em}.profile-name p{color:var(--muted);font-size:12px}.settings-list{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff}.setting-row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:0 14px;text-align:left;font-size:13px}.setting-row:last-child{border:0}.setting-row span{color:var(--muted);font-size:12px}.setting-row.danger-text{color:var(--bad)}
    .modal{position:fixed;inset:0;z-index:90;display:grid;align-items:end;background:rgba(0,0,0,.28);backdrop-filter:blur(5px)}.sheet{width:min(100%,640px);max-height:88dvh;margin:auto;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;border-radius:26px 26px 0 0;background:#fff;padding:10px 16px calc(22px + var(--safe));box-shadow:0 -24px 70px rgba(0,0,0,.14)}.handle{width:42px;height:4px;margin:0 auto 14px;border-radius:999px;background:#ddd}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.sheet-head span,.field label{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.sheet-head h2{font-size:24px;letter-spacing:-.05em}.close{width:38px;height:38px;border-radius:13px;background:#f2f2f0;font-size:21px}.field{display:grid;gap:7px;margin-bottom:11px}.input{min-height:47px;padding:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.result-row,.cook-step{display:grid;grid-template-columns:auto 1fr;gap:9px;padding:11px;border-bottom:1px solid var(--line);font-size:13px}.result-row span{color:var(--muted)}.loading{display:grid;place-items:center;gap:10px;min-height:160px;color:var(--muted)}.loader{width:36px;height:36px;border-radius:50%;border:3px solid #e7e7e4;border-top-color:#111;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe) + 12px);z-index:100;max-width:min(90vw,480px);transform:translate(-50%,14px);padding:10px 13px;border-radius:13px;background:#111;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.nav{position:fixed;left:50%;bottom:0;z-index:50;width:min(100%,760px);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + var(--safe));border-top:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(18px);transform:translateX(-50%)}.nav button{display:grid;place-items:center;gap:2px;min-height:54px;color:#999;font-weight:700}.nav button.active{color:#111}.nav b{font-size:16px}.nav span{font-size:10px}
    .chat-intro.welcome-done h1{animation:none}@media (min-width:680px){.page{padding-left:24px;padding-right:24px}.chat-intro{padding-top:58px}.chat{min-height:410px}}@media (max-width:420px){.chat-intro{min-height:174px;padding-right:100px}.chat-intro h1{font-size:37px}.scene{transform:scale(.88);transform-origin:right top}.form-grid{grid-template-columns:1fr}}@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="app"><main id="view"></main></div>
  <nav class="nav" aria-label="Навигация">
    <button class="active" data-view="home"><b>◉</b><span>Чат</span></button>
    <button data-view="inbox"><b>✓</b><span>Задачи</span></button>
    <button data-view="food"><b>◒</b><span>Еда</span></button>
    <button data-view="memory"><b>○</b><span>Профиль</span></button>
  </nav>
  <div id="modal-root"></div><div id="toast" class="toast" role="status"></div><input id="import-file" class="hidden" type="file" accept="application/json"><input id="food-photo" class="hidden" type="file" accept="image/*" capture="environment">
  <script>
    const TG=window.Telegram?.WebApp;TG?.ready();TG?.expand();TG?.setHeaderColor?.('#f7f7f5');TG?.setBackgroundColor?.('#f7f7f5');
    const USER=TG?.initDataUnsafe?.user,USER_ID=String(USER?.id||'guest'),KEY=`dailyos.ai.v5.${USER_ID}`,OLD4=`dailyos.black.v4.${USER_ID}`,OLDCHAT=`dailyos.chat.v1.${USER_ID}`;
    const API_BASE=/^(dailyos\.onrender\.com|localhost|127\.0\.0\.1)$/.test(location.hostname)?'':'https://dailyos.onrender.com';
    const PR={high:'Высокий',medium:'Средний',low:'Низкий'},CATS=['Работа','Личное','Здоровье','Учёба','Дом','Покупки','Еда','Другое'];
    const MODES={today:'Сегодня',rescue:'Спаси день',now:'Что сейчас',inbox:'Входящие',food:'Еда',mini:'Мини-версия',ideas:'Идеи'};
    let view='home',activeTaskFilter='today',toastTimer,welcomeDone=false,aiHealth={ai:false,provider:'dailyos'},sync='local',aiResult=null,editing=null;
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
    const day=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>day(),addDays=(date,n)=>{const d=new Date(`${date}T12:00:00`);d.setDate(d.getDate()+n);return day(d)},fmt=date=>date===today()?'Сегодня':date===addDays(today(),1)?'Завтра':new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(`${date}T12:00:00`));
    function blank(){const chat=thread('today','Чат','Привет! Расскажи, что нужно сделать, а я помогу превратить это в понятные шаги.');return{version:5,tasks:[],recipes:[],memory:{energy:'medium',hours:'09:00-20:00',notes:[]},threads:[chat],activeThread:chat.id,demo:false}}
    function thread(mode,title=MODES[mode]||'Чат',seed=''){return{id:uid(),mode,title,createdAt:Date.now(),messages:seed?[{id:uid(),role:'assistant',text:seed,at:Date.now()}]:[]}}
    function normalizeTask(t={}){const category=t.category||t.area;return{id:t.id||uid(),title:String(t.title||t.name||'Новая задача').slice(0,120),notes:String(t.notes||t.why||'').slice(0,900),date:/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')?t.date:today(),time:/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time||'')?t.time:'',duration:Math.min(480,Math.max(5,Number(t.duration)||30)),priority:PR[t.priority]?t.priority:'medium',category:CATS.includes(category)?category:'Личное',source:t.source||'manual',done:Boolean(t.done),createdAt:t.createdAt||Date.now(),completedAt:t.completedAt||null,subtasks:Array.isArray(t.subtasks)?t.subtasks.map(s=>typeof s==='string'?{id:uid(),title:s,done:false}:{id:s.id||uid(),title:String(s.title||'').slice(0,120),done:Boolean(s.done)}).filter(s=>s.title):[]}}
    function normalizeRecipe(r={}){return{id:r.id||uid(),title:String(r.title||'Блюдо').slice(0,100),time:String(r.time||r.duration||'25 мин').slice(0,40),difficulty:String(r.difficulty||'средне').slice(0,40),calories:String(r.calories||'').slice(0,50),ingredients:(r.ingredients||[]).map(x=>String(x).slice(0,80)).slice(0,14),shopping:(r.shopping||[]).map(x=>String(x).slice(0,80)).slice(0,10),steps:(r.steps||[]).map(x=>String(x).slice(0,180)).slice(0,10),createdAt:r.createdAt||Date.now(),favorite:Boolean(r.favorite)}}
    function normalizeThread(t={}){return{id:t.id||uid(),mode:t.mode||'today',title:String(t.title||MODES[t.mode]||'Чат').slice(0,40),createdAt:t.createdAt||Date.now(),messages:Array.isArray(t.messages)?t.messages.slice(-40).map(m=>({id:m.id||uid(),role:m.role==='user'?'user':'assistant',text:String(m.text||'').slice(0,1600),tasks:Array.isArray(m.tasks)?m.tasks.slice(0,10):[],recipe:m.recipe||null,plan:Array.isArray(m.plan)?m.plan.slice(0,20):[],at:m.at||Date.now()})).filter(m=>m.text):[]}}
    function readJSON(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}}
    function load(){const saved=readJSON(KEY);if(saved?.version===5)return revive(saved);const old=readJSON(OLD4),oldChat=readJSON(OLDCHAT),base=blank();if(old?.tasks)base.tasks=old.tasks.map(normalizeTask);if(Array.isArray(oldChat)&&oldChat.length)base.threads[0].messages=oldChat.slice(-25).map(m=>({id:uid(),role:m.role==='user'?'user':'assistant',text:m.text||'',tasks:m.tasks||[],at:m.at||Date.now()}));const legacy=readJSON('dailyos.tasks');if(!base.tasks.length&&Array.isArray(legacy))base.tasks=legacy.map(normalizeTask);return base}
    function revive(d){const base=blank();return{...base,...d,version:5,tasks:(d.tasks||[]).map(normalizeTask),recipes:(d.recipes||[]).map(normalizeRecipe),memory:{...base.memory,...d.memory,notes:Array.isArray(d.memory?.notes)?d.memory.notes.slice(-20):[]},threads:(d.threads?.length?d.threads:base.threads).map(normalizeThread),activeThread:d.activeThread||base.threads[0].id}}
    let state=revive(load());
    const cloud=()=>TG?.CloudStorage,cloudGet=k=>new Promise(r=>{try{cloud()?.getItem(k,(e,v)=>r(e?null:v||null))}catch(_){r(null)}}),cloudSet=(k,v)=>new Promise(r=>{try{cloud()?.setItem(k,v,e=>r(!e))}catch(_){r(false)}});
    function setStatus(){const s=$('#sync-status');if(s)s.textContent=`${aiHealth.ai?'AI':'local'} · ${sync}`}function slimState(){return{...state,threads:state.threads.map(t=>({...t,messages:t.messages.slice(-8)}))}}function save(){const raw=JSON.stringify(state);localStorage.setItem(KEY,raw);const cloudRaw=JSON.stringify(slimState());if(cloud()?.setItem&&cloudRaw.length<3900){sync='syncing';setStatus();cloudSet(KEY,cloudRaw).then(ok=>{sync=ok?'cloud':'local';setStatus()})}else{sync=cloud()?.setItem?'local big':'local';setStatus()}}
    async function bootCloud(){if(!cloud()?.getItem){sync='local';setStatus();return}const raw=await cloudGet(KEY);if(raw&&!localStorage.getItem(KEY)){try{state=revive(JSON.parse(raw));localStorage.setItem(KEY,raw);sync='cloud';render();return}catch(_){}}sync='cloud ready';setStatus()}
    const tap=(kind='select')=>kind==='success'?TG?.HapticFeedback?.notificationOccurred?.('success'):TG?.HapticFeedback?.selectionChanged?.(),name=()=>USER?.first_name||'друг',initial=()=>name().slice(0,1).toUpperCase();
    function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
    const current=()=>state.threads.find(t=>t.id===state.activeThread)||state.threads[0],openTasks=()=>state.tasks.filter(t=>!t.done).sort(sortTask),todayTasks=()=>state.tasks.filter(t=>t.date===today()),doneToday=()=>state.tasks.filter(t=>t.done&&t.completedAt&&day(new Date(t.completedAt))===today());
    function sortTask(a,b){const p={high:0,medium:1,low:2};return(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99')||p[a.priority]-p[b.priority]}
    console.assert(normalizeTask({priority:'bad'}).priority==='medium','task normalize');
    function mark(type='chat'){return`<div class="mark ${type}"><i></i><i></i><i></i></div>`}
    function homeView(){const cur=current();return`<section class="page chat-page"><div class="chat-intro ${welcomeDone?'welcome-done':''}">${mark()}<h1>Начни выполнять<br>свои задачи проще!</h1></div><div class="chat-shell">${chatHTML(cur)}${composer()}</div></section>`}
    function chatHTML(t){return`<div class="chat" id="chat-box">${t.messages.length?t.messages.map(messageHTML).join(''):`<article class="msg assistant"><small>DailyOS AI</small>Привет! Расскажи, что нужно сделать, а я помогу превратить это в понятные шаги.</article>`}</div>`}
    function messageHTML(m){const r=m.recipe;return`<article class="msg ${m.role==='user'?'user':'assistant'}"><small>${m.role==='user'?'Ты':'DailyOS AI'}</small>${esc(m.text)}${r?`<div class="recipe-inline"><h3>${esc(r.title||'Рецепт')}</h3><p>${esc(r.time||'')} ${r.difficulty?`· ${esc(r.difficulty)}`:''}</p>${r.ingredients?.length?`<p><b>Ингредиенты:</b> ${esc(r.ingredients.join(', '))}</p>`:''}${r.steps?.length?`<ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}</div>`:''}</article>`}
    function composer(){return`<div class="composer"><form id="chat-form"><textarea id="chat-text" maxlength="1200" placeholder="Напиши сообщение..."></textarea><button class="send" type="submit" aria-label="Отправить">↑</button></form></div>`}
    const empty=(title,text)=>`<div class="empty"><b>${esc(title)}</b><span>${esc(text)}</span></div>`;
    function inboxView(){let list=[...state.tasks].sort(sortTask);if(activeTaskFilter==='today')list=list.filter(t=>t.date===today());if(activeTaskFilter==='done')list=list.filter(t=>t.done);if(activeTaskFilter==='open')list=list.filter(t=>!t.done);return`<section class="page"><div class="page-head">${mark('tasks')}<div><h1>Задачи</h1><p>${openTasks().length} открытых</p></div><button class="add" data-action="task-new" aria-label="Новая задача">+</button></div><div class="chips">${[['today','Сегодня'],['open','Входящие'],['all','Все'],['done','Готовые']].map(([k,v])=>`<button class="chip ${activeTaskFilter===k?'active':''}" data-filter="${k}">${v}</button>`).join('')}</div><div class="task-list">${list.length?list.map(taskHTML).join(''):empty('Задач нет','Добавь первую задачу кнопкой +')}</div></section>`}
    function taskHTML(t){const subs=(t.subtasks||[]).filter(s=>!s.done);return`<article class="task ${t.done?'done':''}"><button class="check" data-action="task-toggle" data-id="${esc(t.id)}" aria-label="Готово">✓</button><button class="task-main" data-action="task-edit" data-id="${esc(t.id)}"><div class="task-title">${esc(t.title)}</div><div class="meta"><span class="pill ${t.priority}">${PR[t.priority]}</span><span>${esc(t.category)}</span><span>${t.duration} мин</span>${subs[0]?`<span>шаг: ${esc(subs[0].title)}</span>`:''}</div></button><div class="date">${t.time?`<b>${esc(t.time)}</b>`:''}${t.date!==today()?esc(fmt(t.date)):''}</div></article>`}
    function foodView(){return`<section class="page"><div class="page-head">${mark('food')}<div><h1>Еда</h1><p>Что есть дома?</p></div></div><div class="food-actions"><form class="quick" id="food-form"><div class="quick-row"><textarea id="food-text" maxlength="1200" placeholder="Курица, рис, помидоры..."></textarea><button type="submit" aria-label="Найти блюда">↑</button></div></form><button class="camera" data-action="food-photo" aria-label="Сфотографировать продукты">▣</button></div><div class="section"><h2>Сохранённые</h2><span>${state.recipes.length}</span></div><div class="recipe-list">${state.recipes.length?state.recipes.map(recipeHTML).join(''):empty('Рецептов нет','Введи продукты или сделай фото.')}</div></section>`}
    function recipeHTML(r){return`<article class="recipe"><div class="recipe-top"><div><h3>${esc(r.title)}</h3><div class="meta"><span class="pill">${esc(r.time)}</span><span class="pill">${esc(r.difficulty)}</span>${r.calories?`<span class="pill">${esc(r.calories)}</span>`:''}</div></div><button class="ghost" data-action="cook" data-id="${esc(r.id)}">Готовлю</button></div>${r.ingredients.length?`<p style="margin-top:10px">${esc(r.ingredients.slice(0,6).join(', '))}</p>`:''}${r.shopping.length?`<div class="mini">Докупить: ${esc(r.shopping.join(', '))}</div>`:''}</article>`}
    function memoryView(){return`<section class="page"><div class="page-head">${mark('profile')}<div><h1>Профиль</h1><p>DailyOS</p></div></div><div class="profile-name"><h2>${esc(name())}</h2><p>DailyOS AI · ${esc(sync)}</p></div><div class="section"><h2>Ассистент</h2><span>${state.memory.notes.length} правил</span></div><div class="settings-list"><button class="setting-row" data-action="settings">Рабочее время <span>${esc(state.memory.hours)}</span></button><button class="setting-row" data-action="settings">Уровень энергии <span>${{low:'Низкий',medium:'Средний',high:'Высокий'}[state.memory.energy]||'Средний'}</span></button><button class="setting-row" data-action="memory-add">AI-память <span>${state.memory.notes.length}</span></button></div><div class="section"><h2>Данные</h2><span>локально</span></div><div class="settings-list"><button class="setting-row" data-action="export-data">Экспорт <span>JSON</span></button><button class="setting-row" data-action="import-data">Импорт <span>JSON</span></button><div class="setting-row">Синхронизация <span>${esc(sync)}</span></div><button class="setting-row danger-text" data-action="clear-data">Очистить данные <span>Удалить</span></button></div></section>`}
    function render(){const f={home:homeView,inbox:inboxView,food:foodView,memory:memoryView}[view]||homeView;$('#view').innerHTML=f();$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));setStatus();updateBack();requestAnimationFrame(()=>{const c=$('#chat-box');if(c)c.scrollTop=c.scrollHeight});if(view==='home')setTimeout(()=>welcomeDone=true,3000)}
    function updateBack(){const modalOpen=!!$('#modal-root').children.length;if(modalOpen||view!=='home')TG?.BackButton?.show();else TG?.BackButton?.hide()}function goBack(){if($('#modal-root').children.length)closeModal();else if(view!=='home'){view='home';render();scrollTo(0,0)}}TG?.BackButton?.onClick(goBack);
    function openModal(html){$('#modal-root').innerHTML=`<div class="modal"><section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div>${html}</section></div>`;updateBack()}function closeModal(){$('#modal-root').innerHTML='';editing=null;aiResult=null;updateBack()}
    function loading(title,text){openModal(`<div class="sheet-head"><div><span>DailyOS AI</span><h2>${esc(title)}</h2></div><button class="close" data-action="close">×</button></div><div class="loading"><div class="loader"></div>${esc(text)}</div>`)}
    async function api(path,options={}){try{return await fetch(`${API_BASE}${path}`,options)}catch(_){throw new Error('Не могу достучаться до сервера. Открой Mini App через кнопку бота или проверь деплой Render.')}}
    async function callAI(action,payload){if(!TG?.initData)throw new Error('AI работает внутри Telegram Mini App');const r=await api('/api/ai',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':TG.initData},body:JSON.stringify({action,payload})});if(!r.ok)throw new Error(await r.text()||'AI недоступен');return(await r.json()).result}
    function chatContext(){return{today:today(),now:new Date().toTimeString().slice(0,5),memory:state.memory,tasks:openTasks().slice(0,12).map(t=>({taskId:t.id,title:t.title,date:t.date,time:t.time,duration:t.duration,priority:t.priority})),doneToday:doneToday().map(t=>t.title).slice(0,5)}}
    async function sendChat(text,mode=current().mode){text=text.trim();if(!text)return;const t=current();t.messages.push({id:uid(),role:'user',text,at:Date.now()});save();render();try{const res=await callAI('chat',{mode,message:text.slice(0,1200),history:t.messages.slice(-8).map(m=>({role:m.role,text:m.text.slice(0,600)})),context:chatContext()});t.messages.push({id:uid(),role:'assistant',text:String(res.reply||'Готово.').slice(0,1600),tasks:Array.isArray(res.tasks)?res.tasks.slice(0,10):[],recipe:res.recipe||null,plan:Array.isArray(res.plan)?res.plan.slice(0,20):[],at:Date.now()});save();render();tap('success')}catch(e){t.messages.push({id:uid(),role:'assistant',text:e.message,at:Date.now()});save();render()}}
    function startMode(mode){const titles={rescue:'Спаси день',now:'Что сейчас',inbox:'Разбор входящих',food:'Еда',mini:'Мини-версия',today:'Сегодня'};const prompts={rescue:'Запусти режим Спаси день. Сам проанализируй мои задачи, скажи что оставить, что перенести, что удалить, и предложи план кнопкой.',now:'Выбери одну задачу, которую лучше сделать сейчас. Дай причину и мини-версию на 3 минуты.',inbox:'Помоги разобрать входящие. Спроси, что вставить или отправить боту, и объясни как сохранить результат.',food:'Запусти режим еды. Спроси продукты и предложи, как из них собрать ужин.',mini:'Сделай мини-версию самой важной задачи: первый шаг на 3 минуты и нормальный следующий шаг.'};const t=thread(mode,titles[mode]||'Чат');state.threads.unshift(t);state.activeThread=t.id;state.threads=state.threads.slice(0,12);view='home';save();render();sendChat(prompts[mode]||'Помоги мне с этим.',mode)}
    function importMsgTasks(id){const m=current().messages.find(x=>x.id===id),items=Array.isArray(m?.tasks)?m.tasks:[];for(const x of items)state.tasks.unshift(normalizeTask({...x,source:'ai'}));save();tap('success');toast(`Создано задач: ${items.length}`);render()}
    function saveMsgRecipe(id){const m=current().messages.find(x=>x.id===id);if(!m?.recipe)return;state.recipes.unshift(normalizeRecipe(m.recipe));save();tap('success');toast('Рецепт сохранён');view='food';render()}
    function applyMsgPlan(id){const m=current().messages.find(x=>x.id===id),plan=Array.isArray(m?.plan)?m.plan:[];let changed=0;for(const x of plan){const t=state.tasks.find(t=>t.id===x.taskId);if(!t)continue;if(x.delete){state.tasks=state.tasks.filter(z=>z.id!==t.id);changed++;continue}if(/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')){t.date=x.date;changed++}if(/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time||'')){t.time=x.time;changed++}if(x.done===true){t.done=true;t.completedAt=Date.now();changed++}}save();tap('success');toast(`Изменено: ${changed}`);render()}
    async function captureAI(text,source='text'){text=text.trim();if(!text)return toast('Нет текста');loading('AI-разбор','Достаю задачи, даты и покупки...');try{aiResult=await callAI('capture',{text,today:today(),currentTime:new Date().toTimeString().slice(0,5)});const tasks=Array.isArray(aiResult.tasks)?aiResult.tasks.slice(0,14):[];openModal(`<div class="sheet-head"><div><span>AI-разбор</span><h2>Подтверди</h2></div><button class="close" data-action="close">×</button></div><div class="result-list">${tasks.map((t,i)=>`<label class="result-row"><input type="checkbox" data-ai-task="${i}" checked><span><b>${esc(t.title)}</b><br>${esc(t.date||today())} · ${Number(t.duration)||30} мин · ${esc(PR[t.priority]||PR.medium)}</span></label>`).join('')||empty('Не нашёл задач','Попробуй написать конкретнее.')}</div>${tasks.length?`<button class="primary" style="width:100%;margin-top:12px" data-action="import-ai" data-source="${esc(source)}">Добавить выбранное</button>`:''}`)}catch(e){closeModal();toast(e.message)}}
    function importAI(source){const items=Array.isArray(aiResult?.tasks)?aiResult.tasks:[],chosen=$$('[data-ai-task]:checked').map(x=>items[Number(x.dataset.aiTask)]).filter(Boolean);for(const t of chosen)state.tasks.unshift(normalizeTask({...t,source}));save();closeModal();tap('success');toast(`Добавлено: ${chosen.length}`);view='inbox';render()}
    async function cookText(text){text=text.trim();if(!text)return toast('Напиши продукты');loading('Холодильник','Придумываю блюда из твоих продуктов...');try{const res=await callAI('recipe',{text,today:today(),memory:state.memory,recipes:state.recipes.slice(0,6)});if(!Array.isArray(res.recipes)||!res.recipes.length)throw new Error('DailyOS AI не нашёл рецепты. Перечисли продукты точнее.');const recipes=res.recipes.slice(0,3).map(normalizeRecipe);openModal(`<div class="sheet-head"><div><span>Холодильник</span><h2>Что приготовить</h2></div><button class="close" data-action="close">×</button></div><p style="color:var(--muted);line-height:1.5;margin-bottom:12px">${esc(res.message||'Выбери блюдо.')}</p><div class="recipe-list">${recipes.map((r,i)=>recipeChoiceHTML(r,i)).join('')}</div>`);aiResult={recipes}}catch(e){closeModal();toast(e.message)}}
    function recipeChoiceHTML(r,i){return`<article class="recipe"><h3>${esc(r.title)}</h3><div class="meta"><span class="pill">${esc(r.time)}</span><span class="pill">${esc(r.difficulty)}</span>${r.calories?`<span class="pill">${esc(r.calories)}</span>`:''}</div>${r.ingredients.length?`<p><b>Ингредиенты:</b> ${esc(r.ingredients.join(', '))}</p>`:''}${r.steps.length?`<ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}${r.shopping.length?`<div class="mini">Докупить: ${esc(r.shopping.join(', '))}</div>`:''}<button class="primary" style="width:100%;margin-top:12px" data-action="save-recipe" data-index="${i}">Сохранить</button></article>`}
    async function cookPhoto(file){if(!file)return;loading('Фото продуктов','Распознаю продукты и подбираю блюда...');try{const fd=new FormData();fd.append('photo',file);const r=await api('/api/fridge/photo',{method:'POST',headers:{'X-Telegram-Init-Data':TG?.initData||''},body:fd});if(!r.ok)throw new Error(await r.text()||'Фото не распознано');const res=(await r.json()).result,recipes=(res.recipes||[]).slice(0,3).map(normalizeRecipe);openModal(`<div class="sheet-head"><div><span>Холодильник</span><h2>По фото</h2></div><button class="close" data-action="close">×</button></div><p style="color:var(--muted);line-height:1.5;margin-bottom:12px">${esc(res.message||'Нашёл продукты.')}</p><div class="recipe-list">${recipes.map((r,i)=>recipeChoiceHTML(r,i)).join('')}</div>`);aiResult={recipes}}catch(e){closeModal();toast(e.message)}}
    function saveRecipe(i){const r=aiResult?.recipes?.[Number(i)];if(!r)return;state.recipes.unshift(normalizeRecipe(r));save();closeModal();tap('success');toast('Рецепт сохранён');render()}
    function cookSteps(id){const r=state.recipes.find(x=>x.id===id);if(!r)return;openModal(`<div class="sheet-head"><div><span>Режим готовки</span><h2>${esc(r.title)}</h2></div><button class="close" data-action="close">×</button></div><div class="result-list">${(r.steps.length?r.steps:['Подготовь продукты','Готовь по базовому рецепту','Попробуй и поправь соль']).map((s,i)=>`<div class="cook-step"><b>Шаг ${i+1}</b><p style="margin-top:6px;color:var(--muted);line-height:1.45">${esc(s)}</p></div>`).join('')}</div><button class="secondary" style="width:100%;margin-top:12px" data-mode="food">Спросить замену продукта</button>`)}
    function taskForm(t={}){editing=t.id||null;const v={title:'',notes:'',date:today(),time:'',duration:30,category:'Личное',priority:'medium',...t};openModal(`<div class="sheet-head"><div><span>${editing?'Редактирование':'Новая задача'}</span><h2>Задача</h2></div><button class="close" data-action="close">×</button></div><form id="task-form"><div class="field"><label>Название</label><input class="input" id="task-title" maxlength="120" required value="${esc(v.title)}" placeholder="Что сделать?"></div><div class="field"><label>Контекст</label><textarea class="input" id="task-notes" maxlength="900" placeholder="Детали, ссылки, критерий готовности">${esc(v.notes)}</textarea></div><div class="form-grid"><div class="field"><label>Дата</label><input class="input" id="task-date" type="date" value="${esc(v.date)}"></div><div class="field"><label>Время</label><input class="input" id="task-time" type="time" value="${esc(v.time)}"></div></div><div class="form-grid"><div class="field"><label>Минуты</label><input class="input" id="task-duration" type="number" min="5" max="480" step="5" value="${v.duration}"></div><div class="field"><label>Категория</label><select class="input" id="task-category">${CATS.map(c=>`<option ${v.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label>Приоритет</label><select class="input" id="task-priority">${Object.entries(PR).map(([k,l])=>`<option value="${k}" ${v.priority===k?'selected':''}>${l}</option>`).join('')}</select></div><button class="primary" style="width:100%;margin-top:8px" type="submit">Сохранить</button>${editing?`<button class="danger" style="width:100%;margin-top:10px" type="button" data-action="task-delete" data-id="${esc(editing)}">Удалить</button>`:''}</form>`)}
    function saveTask(){const title=$('#task-title').value.trim();if(!title)return toast('Назови задачу');const old=state.tasks.find(t=>t.id===editing),task=normalizeTask({id:old?.id,title,notes:$('#task-notes').value.trim(),date:$('#task-date').value||today(),time:$('#task-time').value,duration:$('#task-duration').value,category:$('#task-category').value,priority:$('#task-priority').value,source:old?.source||'manual',done:old?.done,createdAt:old?.createdAt,completedAt:old?.completedAt,subtasks:old?.subtasks||[]});if(old)state.tasks[state.tasks.indexOf(old)]=task;else state.tasks.unshift(task);save();closeModal();tap('success');toast(old?'Обновлено':'Создано');render()}
    function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?Date.now():null;save();tap(t.done?'success':'select');render()}
    function addMemory(){openModal(`<div class="sheet-head"><div><span>Память</span><h2>Правила для AI</h2></div><button class="close" data-action="close">×</button></div>${state.memory.notes.length?`<div class="result-list">${state.memory.notes.map((x,i)=>`<div class="result-row"><b>${i+1}</b><span>${esc(x)}</span></div>`).join('')}</div>`:''}<form id="memory-form" style="margin-top:14px"><div class="field"><label>Новое правило</label><textarea class="input" id="memory-text" maxlength="300" placeholder="Например: вечером не ставить тяжёлые задачи"></textarea></div><button class="primary" style="width:100%">Сохранить</button></form>`)}
    function saveMemory(){const x=$('#memory-text').value.trim();if(!x)return;state.memory.notes.unshift(x);state.memory.notes=state.memory.notes.slice(0,20);save();closeModal();toast('Запомнил');render()}
    function settings(){openModal(`<div class="sheet-head"><div><span>Настройки</span><h2>DailyOS</h2></div><button class="close" data-action="close">×</button></div><form id="settings-form"><div class="field"><label>Энергия сегодня</label><select class="input" id="set-energy"><option value="low" ${state.memory.energy==='low'?'selected':''}>Мало</option><option value="medium" ${state.memory.energy==='medium'?'selected':''}>Нормально</option><option value="high" ${state.memory.energy==='high'?'selected':''}>Много</option></select></div><div class="field"><label>Рабочее время</label><input class="input" id="set-hours" value="${esc(state.memory.hours)}" placeholder="09:00-20:00"></div><button class="primary" style="width:100%">Сохранить</button></form>`)}
    function saveSettings(){state.memory.energy=$('#set-energy').value;state.memory.hours=$('#set-hours').value.trim().slice(0,40)||'09:00-20:00';save();closeModal();toast('Настройки сохранены');render()}
    function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dailyos-data.json';a.click();URL.revokeObjectURL(a.href)}
    function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state=revive(JSON.parse(r.result));save();render();toast('Импорт готов')}catch(_){toast('Файл не похож на DailyOS')}};r.readAsText(file)}
    async function bootCapture(){const p=new URLSearchParams(location.search),id=p.get('capture_id'),old=p.get('capture');if(old){captureAI(old,'telegram');history.replaceState(null,'','/');return}if(!id)return;try{const r=await api(`/api/capture/${encodeURIComponent(id)}`,{headers:{'X-Telegram-Init-Data':TG?.initData||''}});if(!r.ok)throw new Error(await r.text());const data=await r.json();history.replaceState(null,'','/');captureAI(data.text,'telegram')}catch(e){toast(e.message)}}
    document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const x=$('#chat-text');sendChat(x.value);x.value=''}if(e.target.id==='capture-form'){e.preventDefault();captureAI($('#capture-text').value,'manual')}if(e.target.id==='food-form'){e.preventDefault();cookText($('#food-text').value)}if(e.target.id==='task-form'){e.preventDefault();saveTask()}if(e.target.id==='memory-form'){e.preventDefault();saveMemory()}if(e.target.id==='settings-form'){e.preventDefault();saveSettings()}});
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(b.dataset.view){view=b.dataset.view;tap();render();scrollTo(0,0)}if(b.dataset.mode){tap();startMode(b.dataset.mode)}if(b.dataset.thread){state.activeThread=b.dataset.thread;view='home';save();render()}if(a==='new-chat'){const t=thread('today','Новый чат','Чем помочь?');state.threads.unshift(t);state.activeThread=t.id;save();render()}if(a==='close')closeModal();if(a==='task-new')taskForm();if(a==='task-edit')taskForm(state.tasks.find(t=>t.id===b.dataset.id));if(a==='task-toggle')toggleTask(b.dataset.id);if(a==='task-delete'){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.id);save();closeModal();render()}if(a==='import-msg-tasks')importMsgTasks(b.dataset.id);if(a==='save-msg-recipe')saveMsgRecipe(b.dataset.id);if(a==='apply-msg-plan')applyMsgPlan(b.dataset.id);if(a==='import-ai')importAI(b.dataset.source);if(a==='food-photo')$('#food-photo').click();if(a==='save-recipe')saveRecipe(b.dataset.index);if(a==='cook')cookSteps(b.dataset.id);if(a==='memory-add')addMemory();if(a==='settings')settings();if(a==='export-data')exportData();if(a==='import-data')$('#import-file').click();if(a==='clear-data'&&confirm('Удалить локальные данные DailyOS?')){localStorage.removeItem(KEY);state=blank();save();render()}});
    document.addEventListener('change',e=>{if(e.target.id==='import-file')importData(e.target.files[0]);if(e.target.id==='food-photo')cookPhoto(e.target.files[0]);if(e.target.dataset.filter){activeTaskFilter=e.target.dataset.filter;render()}});
    document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){activeTaskFilter=f.dataset.filter;render()}});
    render();bootCloud();bootCapture();
  </script>
</body>
