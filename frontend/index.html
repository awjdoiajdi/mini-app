    const TASK_INTENT=/^(?:.*\s)?(добав(?:ь|ить|ляй|ьте)|создай|создат(?:ь|е)|запиши|занеси|поставь|оформи|сделай|напомни)(?:\s+мне)?\s.*(задач|дел|напомин|встреч|звонок|пункт)/i;
    const NEARBY_INTENT=/(?:^|[^\p{L}])(?:рядом|поблизости|неподал[её]ку|в округе|около меня|ближайш\p{L}*|nearby|near me|nearest|closest|around me|close by)(?=$|[^\p{L}])/iu,PLACE_KIND=/(?:^|[^\p{L}])(?:кафе|ресторан\p{L}*|поесть|кофейн\p{L}*|бар(?:ы|ов)?|аптек\p{L}*|магазин\p{L}*|супермаркет\p{L}*|банкомат\p{L}*|парковк\p{L}*|спортзал\p{L}*|фитнес\p{L}*|отел\p{L}*|гостиниц\p{L}*|достопримечательност\p{L}*|музе\p{L}*|театр\p{L}*|кино|парк\p{L}*|заправк\p{L}*|клиник\p{L}*|больниц\p{L}*|стоматолог\p{L}*|салон\p{L}*|places?|restaurants?|cafes?|pharmac(?:y|ies)|stores?|hotels?|gyms?|parking|atms?)(?=$|[^\p{L}])/iu,PLACE_REQUEST=/(?:^|[^\p{L}])(?:найди|покажи|подскажи|посоветуй|ищу|где|есть\s+ли|find|show(?: me)?|where(?:\s+is|\s+are)?|looking for)(?=$|[^\p{L}])/iu,PLACE_QUESTION=/(?:^|[^\p{L}])(?:какой|какая|какое|какие|what|any)\s/iu,NON_PLACE=/(?:задач|напомин|сообщени|рецепт|файл|код|ошибк|план дня)/i;
    function placeQuery(text){if(NON_PLACE.test(text)||!NEARBY_INTENT.test(text))return'';const query=text.replace(/(?:найди|покажи|подскажи|посоветуй|ищу|find|show me|where(?: is| are)?|looking for|где(?: есть| найти| можно)?|есть ли)/ig,' ').replace(/(?:рядом|поблизости|неподал[её]ку|в округе|около меня|ближайш\p{L}*|nearby|near me|nearest|closest|around me|close by)/igu,' ').replace(/поесть/ig,' ресторан ').replace(/^[\s,.?!]+|[\s,.?!]+$/g,'').replace(/\s+/g,' ').trim(),short=PLACE_KIND.test(query)&&!query.includes(' '),question=PLACE_QUESTION.test(text)&&PLACE_KIND.test(text);if(!PLACE_REQUEST.test(text)&&!short&&!question)return'';return(query||text).slice(0,120)}
    console.assert(placeQuery('найди поблизости где поесть')==='ресторан'&&placeQuery('найди ветеринара неподалёку')==='ветеринара'&&placeQuery('кафе рядом')==='кафе'&&placeQuery('есть ли поблизости аптека?')==='аптека'&&placeQuery('какие хорошие кафе есть рядом?')==='какие хорошие кафе есть'&&!placeQuery('я живу рядом с парком')&&!placeQuery('встречаемся рядом с кафе')&&!placeQuery('найди задачу на сегодня')&&!placeQuery('подскажи, что я хотел сделать')&&!placeQuery('show me how to restore data')&&!placeQuery('найди отель в Париже'),'place intent');
    async function sendChat(text,mode=current().mode){text=text.trim();if(!text)return;tap('light');const t=current(),intent=mode==='today'?TASK_INTENT.test(text):false,place=placeQuery(text);t.messages.push({id:uid(),role:'user',text,at:Date.now()});save();render();if(intent){try{await captureAI(text,'chat');return}catch(e){toast(e.message);return}}if(place){const id=uid();drawingMessageId=id;t.messages.push({id,role:'assistant',text:'Чтобы найти реальные места рядом, разреши геолокацию. Координаты не сохраняются.',placeQuery:place,at:Date.now()});save();render();return}showThinking();try{const res=await callAI('chat',{mode,message:text.slice(0,1200),history:t.messages.slice(-8).map(m=>({role:m.role,text:m.text.slice(0,600)})),context:chatContext()}),id=uid();drawingMessageId=id;t.messages.push({id,role:'assistant',text:String(res.reply||'Готово.').slice(0,1600),tasks:Array.isArray(res.tasks)?res.tasks.slice(0,10):[],recipe:res.recipe||null,plan:Array.isArray(res.plan)?res.plan.slice(0,20):[],at:Date.now()});save();render();tap('success')}catch(e){const id=uid();drawingMessageId=id;t.messages.push({id,role:'assistant',text:e.message,at:Date.now()});save();render()}}
    function getLocation(){return new Promise((resolve,reject)=>{let timer;const finish=value=>{clearTimeout(timer);resolve(value)},fail=()=>{clearTimeout(timer);reject(new Error('Не удалось получить геолокацию. Разреши доступ и попробуй ещё раз.'))},done=location=>{const latitude=Number(location?.latitude),longitude=Number(location?.longitude);Number.isFinite(latitude)&&Number.isFinite(longitude)?finish({latitude,longitude}):fail()},browser=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>done(p.coords),fail,{enableHighAccuracy:false,timeout:10000,maximumAge:60000}):fail(),manager=TG?.LocationManager,locate=()=>manager?.isLocationAvailable&&manager?.getLocation?manager.getLocation(done):browser();timer=setTimeout(fail,12000);if(TG?.isVersionAtLeast?.('8.0')&&manager?.init){manager.isInited?locate():manager.init(locate);return}browser()})}

    function saveSettings(){state.memory.energy=$('#set-energy').value;state.memory.hours=$('#set-hours').value.trim().slice(0,40)||'09:00-20:00';save();closeModal();toast('Настройки сохранены');render()}
    function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dailyos-data.json';a.click();URL.revokeObjectURL(a.href)}
    function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state=revive(JSON.parse(r.result));save();render();toast('Импорт готов')}catch(_){toast('Файл не похож на DailyOS')}};r.readAsText(file)}
    async function bootCapture(){const p=new URLSearchParams(location.search),id=p.get('capture_id'),old=p.get('capture');if(old){captureAI(old,'telegram');history.replaceState(null,'','/');return}if(!id)return;try{const r=await api(`/api/capture/${encodeURIComponent(id)}`,{headers:{'X-Telegram-Init-Data':TG?.initData||''}});if(!r.ok)throw new Error(await r.text());const data=await r.json();history.replaceState(null,'','/');captureAI(data.text,'telegram')}catch(e){toast(e.message)}}
    document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const x=$('#chat-text');sendChat(x.value);x.value=''}if(e.target.id==='capture-form'){e.preventDefault();captureAI($('#capture-text').value,'manual')}if(e.target.id==='food-form'){e.preventDefault();cookText($('#food-text').value)}if(e.target.id==='task-form'){e.preventDefault();saveTask()}if(e.target.id==='memory-form'){e.preventDefault();saveMemory()}if(e.target.id==='settings-form'){e.preventDefault();saveSettings()}});
    function taskTomorrow(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.date=addDays(today(),1);save();closeModal();tap('success');toast('Перенесено на завтра','success');render()}
    function taskDuplicate(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;state.tasks.unshift(normalizeTask({...t,id:undefined,title:`${t.title} (копия)`,createdAt:Date.now(),done:false,completedAt:null}));save();closeModal();tap('success');toast('Дублировано','success');render()}
    let pressTimer=null,pressTarget=null;
    document.addEventListener('touchstart',e=>{const tm=e.target.closest('.task-main');if(!tm)return;pressTarget=tm;pressTimer=setTimeout(()=>{pressTimer=null;const id=tm.dataset.id;if(id){tap('medium');taskQuickActions(id)}},500)},{passive:true});
    document.addEventListener('touchend',e=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null}});
    document.addEventListener('touchmove',e=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null}},{passive:true});
    document.addEventListener('contextmenu',e=>{const tm=e.target.closest('.task-main');if(tm){e.preventDefault();const id=tm.dataset.id;if(id)taskQuickActions(id)}});
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(b.dataset.view){view=b.dataset.view;tap();render();scrollTo(0,0)}if(b.dataset.mode){tap();startMode(b.dataset.mode)}if(b.dataset.thread){state.activeThread=b.dataset.thread;view='home';save();render()}if(a==='new-chat'){const t=thread('today','Новый чат','Чем помочь?');state.threads.unshift(t);state.activeThread=t.id;save();render()}if(a==='finish-onboarding'){hideOnboarding();tap('success')}if(a==='close')closeModal();if(a==='archive-toggle'){archivedOpen=!archivedOpen;render()}if(a==='task-new')taskForm();if(a==='task-edit')taskForm(state.tasks.find(t=>t.id===b.dataset.id));if(a==='task-toggle')toggleTask(b.dataset.id,b.closest('.task'));if(a==='task-pin')taskPin(b.dataset.id);if(a==='task-tomorrow')taskTomorrow(b.dataset.id);if(a==='task-duplicate')taskDuplicate(b.dataset.id);if(a==='task-delete'){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.id);save();closeModal();tap('warning');toast('Удалено','warning');render()}if(a==='copy-message')copyText(current().messages.find(m=>m.id===b.dataset.id)?.text||'');if(a==='message-task')messageTask(b.dataset.id);if(a==='ask-more')askMore(b.dataset.id);if(a==='import-msg-tasks')importMsgTasks(b.dataset.id);if(a==='save-msg-recipe')saveMsgRecipe(b.dataset.id);if(a==='apply-msg-plan')applyMsgPlan(b.dataset.id);if(a==='search-places')searchPlaces(b.dataset.id);if(a==='open-place')openPlace(b.dataset.url);if(a==='import-ai')importAI(b.dataset.source);if(a==='food-photo')$('#food-photo').click();if(a==='focus-food'){view='food';render();requestAnimationFrame(()=>$('#food-text')?.focus())}if(a==='save-recipe')saveRecipe(b.dataset.index);if(a==='cook')cookSteps(b.dataset.id);if(a==='memory-add')addMemory();if(a==='settings')settings();if(a==='export-data')exportData();if(a==='import-data')$('#import-file').click();if(a==='clear-data'&&confirm('Удалить локальные данные DailyOS?')){localStorage.removeItem(KEY);localStorage.removeItem(ONBOARDED_KEY);state=blank();save();render()}});
    document.addEventListener('change',e=>{if(e.target.id==='import-file')importData(e.target.files[0]);if(e.target.id==='food-photo')cookPhoto(e.target.files[0]);if(e.target.dataset.filter){activeTaskFilter=e.target.dataset.filter;render()}});
    document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){activeTaskFilter=f.dataset.filter;render()}});
    document.addEventListener('click',e=>{if(e.target.closest('[data-action="focus-food"]'))$('#food-text')?.focus()});
     document.addEventListener('click',e=>{const b=e.target.closest('[data-action="copy-code"]');if(b)copyText(b.closest('.code-block')?.querySelector('pre')?.textContent||'')});
     addEventListener('scroll',scheduleChatChrome,{passive:true});render();bootCloud();bootCapture();
  </script>
</body>
