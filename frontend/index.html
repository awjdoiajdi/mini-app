  <style>
    :root{

    .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.privacy{display:flex;gap:14px;align-items:flex-start}.seal{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;background:var(--navy);color:#fffaf3;font-weight:900}.modal{position:fixed;inset:0;z-index:80;display:grid;align-items:end;background:rgba(16,26,45,.34);backdrop-filter:blur(8px)}.sheet{width:min(100%,760px);max-height:88vh;margin:0 auto;overflow:auto;border-radius:32px 32px 0 0;background:var(--paper);padding:12px 18px calc(22px + var(--safe));box-shadow:0 -24px 70px rgba(16,26,45,.24)}.handle{width:48px;height:5px;margin:0 auto 14px;border-radius:99px;background:#dbcbb8}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.sheet-head span{display:block;color:var(--soft);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.sheet-head h2{font-size:28px;letter-spacing:-.05em}.close{width:44px;height:44px;border-radius:16px;background:#f3e8d8;font-size:24px;font-weight:800}.field{display:grid;gap:8px;margin-bottom:12px}.field label{color:var(--soft);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.input{min-height:50px;padding:13px 15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.subtasks{display:grid;gap:8px;margin:8px 0 14px}.subtask{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px;border-radius:16px;background:#f6eddc}.subtask button{width:34px;height:34px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:900}.subtask.done span{text-decoration:line-through;color:var(--muted)}.result{display:grid;gap:12px}.result p{color:var(--muted);line-height:1.5}.result-list{display:grid;gap:9px}.result-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:13px;border-radius:18px;background:#f6eddc}.result-row strong{font-size:14px}.result-row span{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.35}.loading{display:grid;place-items:center;gap:14px;min-height:190px;color:var(--soft);font-weight:800}.loader{width:42px;height:42px;border-radius:50%;border:4px solid #eadfce;border-top-color:var(--navy);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe) + 16px);z-index:100;transform:translate(-50%,16px);max-width:min(92vw,520px);padding:13px 16px;border-radius:18px;background:var(--navy);color:#fffaf3;box-shadow:0 18px 46px rgba(16,26,45,.28);opacity:0;pointer-events:none;transition:.2s;font-weight:800;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.fab{position:fixed;right:18px;bottom:calc(var(--nav) + var(--safe) + 18px);z-index:50;width:58px;height:58px;border-radius:22px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:0 18px 40px rgba(184,135,70,.26);font-size:30px;font-weight:800}.nav{position:fixed;left:50%;bottom:calc(10px + var(--safe));z-index:60;transform:translateX(-50%);width:min(calc(100% - 24px),560px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;border:1px solid rgba(184,135,70,.18);border-radius:26px;background:rgba(255,250,243,.88);backdrop-filter:blur(20px);box-shadow:0 16px 48px rgba(38,33,25,.14)}.nav button{display:grid;place-items:center;gap:3px;min-height:54px;border-radius:20px;color:var(--soft);font-size:12px;font-weight:800}.nav button b{font-size:17px;line-height:1}.nav button.active{background:var(--navy);color:#fffaf3}.hidden{display:none!important}

<body>
  <div class="app">
    <header class="top">
      <div class="brand"><div class="logo">D</div><div><b>DailyOS</b><span><i></i><em id="ai-status">local first</em></span></div></div>
      <button class="profile" id="avatar" data-action="settings" aria-label="Профиль">D</button>
    </header>
    <main id="view"></main>
  </div>
  <button class="fab" data-action="task-new" aria-label="Новая задача">+</button>
  <nav class="nav" aria-label="Навигация">
    <button class="active" data-view="day"><b>◇</b><span>День</span></button>
    <button data-view="tasks"><b>✓</b><span>Задачи</span></button>
    <button data-view="focus"><b>◌</b><span>Фокус</span></button>
    <button data-view="stats"><b>▥</b><span>Итоги</span></button>
  </nav>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <input id="import-file" class="hidden" type="file" accept="application/json">
  <script>
    const TG=window.Telegram?.WebApp;TG?.ready();TG?.expand();TG?.setHeaderColor?.('#f7f1e8');TG?.setBackgroundColor?.('#f7f1e8');
    const USER=TG?.initDataUnsafe?.user,USER_ID=String(USER?.id||'guest'),KEY=`dailyos.app.v3.${USER_ID}`;
    const CATS=['Работа','Личное','Здоровье','Учёба','Дом','Другое'],PR={high:'Высокий',medium:'Средний',low:'Низкий'},EN={high:'Высокая',medium:'Средняя',low:'Низкая'},RE={none:'Нет',daily:'Каждый день',weekdays:'Будни',weekly:'Неделя'};
    let view='day',filter='all',query='',editing=null,aiResult=null,aiHealth={ai:false,provider:'groq'},toastTimer,timerTick;
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
    const day=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>day(),addDays=(date,n)=>{const d=new Date(`${date}T12:00:00`);d.setDate(d.getDate()+n);return day(d)};
    const fmt=date=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(`${date}T12:00:00`)),dateTitle=date=>date===today()?'Сегодня':date===addDays(today(),1)?'Завтра':date<today()?'Просрочено':new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric',month:'short'}).format(new Date(`${date}T12:00:00`));
    const blank=()=>({version:3,tasks:[],habits:[],sessions:[],settings:{dayStart:'09:00',dayEnd:'20:00'},timer:{taskId:null,duration:25,remaining:1500,running:false,endsAt:0},demo:false});
    function normalizeTask(t={}){const category=t.category||t.area;return{id:t.id||uid(),title:String(t.title||t.name||'Новая задача').slice(0,120),notes:t.notes||t.why||'',date:/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')?t.date:today(),time:/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time||'')?t.time:'',duration:Math.min(480,Math.max(5,Number(t.duration)||30)),category:CATS.includes(category)?category:'Личное',project:String(t.project||'').slice(0,60),priority:PR[t.priority]?t.priority:'medium',energy:EN[t.energy]?t.energy:'medium',repeat:RE[t.repeat||t.recurrence]?t.repeat||t.recurrence:'none',done:Boolean(t.done),createdAt:t.createdAt||Date.now(),completedAt:t.completedAt||null,spawned:Boolean(t.spawned),subtasks:Array.isArray(t.subtasks)?t.subtasks.map(s=>typeof s==='string'?{id:uid(),title:s,done:false,duration:10}:{id:s.id||uid(),title:String(s.title||'').slice(0,120),done:Boolean(s.done),duration:Number(s.duration)||10}).filter(s=>s.title):[]}}
    function normalizeHabit(h={}){const category=h.category||h.area;return{id:h.id||uid(),title:String(h.title||'Новая привычка').slice(0,80),category:CATS.includes(category)?category:'Личное',history:h.history&&typeof h.history==='object'?h.history:{},createdAt:h.createdAt||Date.now()}}

    async function callAI(action,payload){if(!TG?.initData)throw new Error('AI работает внутри Telegram Mini App');const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':TG.initData},body:JSON.stringify({action,payload})});if(!r.ok)throw new Error(await r.text()||'AI недоступен');return(await r.json()).result}
    function loading(title,text){openModal(`<div class="sheet-head"><div><span>DailyOS AI</span><h2>${esc(title)}</h2></div><button type="button" class="close" data-action="close">×</button></div><div class="loading"><div class="loader"></div>${esc(text)}</div>`)}
    async function aiPlan(){const list=openTasks().filter(t=>t.date<=addDays(today(),2)).slice(0,30);if(!list.length)return toast('Нет задач для плана');loading('AI-план','Собираю реалистичное расписание...');try{aiResult=await callAI('plan',{date:today(),now:new Date().toTimeString().slice(0,5),dayStart:state.settings.dayStart,dayEnd:state.settings.dayEnd,tasks:list.map(t=>({taskId:t.id,title:t.title,date:t.date,time:t.time,duration:t.duration,priority:t.priority,energy:t.energy,category:t.category}))});const schedule=Array.isArray(aiResult.schedule)?aiResult.schedule:[];openModal(`<div class="sheet-head"><div><span>Расписание</span><h2>AI-план</h2></div><button type="button" class="close" data-action="close">×</button></div><div class="result"><b>${esc(aiResult.summary||'План готов')}</b><p>${esc(aiResult.advice||'')}</p><div class="result-list">${schedule.map(x=>{const t=state.tasks.find(t=>t.id===x.taskId);return t?`<div class="result-row"><strong>${esc(x.start||'')}</strong><div><strong>${esc(t.title)}</strong><span>${esc(x.reason||'')}</span></div></div>`:''}).join('')}</div></div><button class="primary" style="width:100%;margin-top:12px" data-action="apply-plan">Применить время</button>`)}catch(e){closeModal();toast(e.message)}}
    function applyPlan(){for(const x of aiResult?.schedule||[]){const t=state.tasks.find(t=>t.id===x.taskId);if(t&&/^([01]\d|2[0-3]):[0-5]\d$/.test(x.start||'')){t.time=x.start;t.date=today()}}save();closeModal();tap('success');toast('План применён');render()}
    async function captureAI(text){text=text.trim();if(!text)return toast('Напиши мысль');loading('AI-разбор','Преобразую текст в задачи...');try{aiResult=await callAI('capture',{text,today:today(),currentTime:new Date().toTimeString().slice(0,5)});const tasks=Array.isArray(aiResult.tasks)?aiResult.tasks.slice(0,12):[];openModal(`<div class="sheet-head"><div><span>AI-разбор</span><h2>Найденные задачи</h2></div><button type="button" class="close" data-action="close">×</button></div><div class="result"><b>${esc(aiResult.message||`Найдено: ${tasks.length}`)}</b><div class="result-list">${tasks.map((t,i)=>`<label class="result-row"><input type="checkbox" data-ai-task="${i}" checked><div><strong>${esc(t.title)}</strong><span>${esc(t.date||today())} · ${Number(t.duration)||30} мин · ${esc(PR[t.priority]||PR.medium)}</span></div></label>`).join('')}</div></div><button class="primary" style="width:100%;margin-top:12px" data-action="import-ai">Добавить выбранное</button>`)}catch(e){closeModal();toast(e.message)}}
    function importAI(){const selected=$$('[data-ai-task]:checked').map(i=>aiResult.tasks[Number(i.dataset.aiTask)]);for(const t of selected)state.tasks.unshift(normalizeTask({title:String(t.title||'Новая задача').slice(0,120),date:/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')?t.date:today(),time:/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time||'')?t.time:'',duration:t.duration,priority:t.priority,energy:t.energy,category:CATS.includes(t.category)?t.category:'Личное'}));save();closeModal();tap('success');toast(`Добавлено: ${selected.length}`);render()}
    async function breakdown(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;loading('AI-шаги','Разбиваю задачу на короткие действия...');try{aiResult=await callAI('breakdown',{title:t.title,notes:t.notes,duration:t.duration,category:t.category});const subs=Array.isArray(aiResult.subtasks)?aiResult.subtasks.slice(0,8):[];openModal(`<div class="sheet-head"><div><span>Подзадачи</span><h2>AI-шаги</h2></div><button type="button" class="close" data-action="close">×</button></div><div class="result"><b>${esc(aiResult.summary||t.title)}</b><p>Первый шаг: ${esc(aiResult.firstStep||subs[0]?.title||'')}</p><div class="result-list">${subs.map((s,i)=>`<div class="result-row"><strong>${i+1}</strong><div><strong>${esc(s.title)}</strong><span>${Number(s.duration)||10} мин</span></div></div>`).join('')}</div></div><button class="primary" style="width:100%;margin-top:12px" data-action="apply-breakdown" data-id="${esc(id)}">Добавить шаги</button>`)}catch(e){closeModal();toast(e.message)}}
    function applyBreakdown(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.subtasks=(aiResult?.subtasks||[]).slice(0,8).map(s=>({id:uid(),title:String(s.title||'').slice(0,120),duration:Number(s.duration)||10,done:false})).filter(s=>s.title);save();closeModal();tap('success');render()}
    function seedDemo(){state=blank();state.demo=true;state.tasks=[{title:'Подготовить конкурсный питч DailyOS',notes:'3 минуты: проблема, решение, приватность без базы данных, живой AI-сценарий',date:today(),time:'10:30',duration:50,category:'Работа',project:'Конкурс',priority:'high',energy:'high',subtasks:['Сформулировать боль','Показать AI-разбор','Показать фокус и итоги'].map(x=>({id:uid(),title:x,done:false,duration:10}))},{title:'Собрать визуальный сценарий демо',notes:'Судья должен увидеть продукт, а не пустой список',date:today(),time:'12:00',duration:40,category:'Учёба',project:'Конкурс',priority:'high',energy:'medium'},{title:'30 минут движения без телефона',notes:'Вернуть энергию перед финальным рывком',date:today(),time:'18:30',duration:30,category:'Здоровье',project:'Энергия',priority:'medium',energy:'low'},{title:'Проверить Render env GROQ_API_KEY',notes:'AI должен отвечать вживую внутри Telegram',date:addDays(today(),1),time:'09:20',duration:15,category:'Работа',project:'Запуск',priority:'medium',energy:'low'}].map(normalizeTask);state.habits=[{title:'Сон до 00:30',category:'Здоровье',history:{[addDays(today(),-2)]:true,[addDays(today(),-1)]:true}},{title:'20 минут обучения',category:'Учёба',history:{[addDays(today(),-1)]:true,[today()]:true}},{title:'Вода утром',category:'Здоровье',history:{[today()]:true}}].map(normalizeHabit);state.sessions=[{id:uid(),date:addDays(today(),-1),minutes:25},{id:uid(),date:today(),minutes:25}];save();tap('success');toast('Пример загружен');render()}
    function startTimer(){const t=focusTask();if(!t)return toast('Сначала создай задачу');if(state.timer.running){state.timer.remaining=secondsLeft();state.timer.running=false}else{state.timer.taskId=t.id;state.timer.endsAt=Date.now()+secondsLeft()*1000;state.timer.running=true}save();render()}function finishTimer(){state.sessions.push({id:uid(),taskId:state.timer.taskId,date:today(),minutes:state.timer.duration,finishedAt:Date.now()});state.timer.running=false;state.timer.remaining=state.timer.duration*60;state.timer.endsAt=0;save();tap('success');toast(`Фокус ${state.timer.duration} мин завершён`);render()}function tickTimer(){const s=secondsLeft(),n=$('#timer');if(n)n.textContent=fmtTimer(s);if(s<=0&&state.timer.running)finishTimer()}
    function settings(){openModal(`<div class="sheet-head"><div><span>Профиль</span><h2>Настройки</h2></div><button type="button" class="close" data-action="close">×</button></div><div class="form-grid"><div class="field"><label>Начало дня</label><input class="input" id="day-start" type="time" value="${esc(state.settings.dayStart)}"></div><div class="field"><label>Конец дня</label><input class="input" id="day-end" type="time" value="${esc(state.settings.dayEnd)}"></div></div><button class="primary" style="width:100%" data-action="save-settings">Сохранить</button><section class="panel privacy" style="margin-top:12px"><div class="seal">D</div><div><h2 style="font-size:20px;letter-spacing:-.04em">${esc(USER?`${USER.first_name||''} ${USER.last_name||''}`.trim()||name():'Локальный профиль')}</h2><p style="margin-top:6px;color:var(--muted);line-height:1.5">ID: ${esc(USER_ID)} · AI: ${aiHealth.ai?'подключён':'нужен GROQ_API_KEY в Render'}</p></div></section>`)}
    function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=Object.assign(document.createElement('a'),{href:url,download:`dailyos-${USER_ID}-${today()}.json`});a.click();URL.revokeObjectURL(url);toast('JSON экспортирован')}async function importData(file){try{const d=JSON.parse(await file.text());if(!Array.isArray(d.tasks))throw Error();state=revive(d);save();closeModal();render();toast('Данные импортированы')}catch(_){toast('Неверный файл DailyOS')}}
    document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='capture-form')captureAI($('#capture-text').value);if(e.target.id==='task-form')saveTask();if(e.target.id==='habit-form')saveHabit()});
    document.addEventListener('input',e=>{if(e.target.id==='task-search'){query=e.target.value;render();requestAnimationFrame(()=>{const i=$('#task-search');i?.focus();i?.setSelectionRange(query.length,query.length)})}});
    document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-filter],[data-action]');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();scrollTo(0,0);tap();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}const a=b.dataset.action;if(a==='task-new')taskForm();if(a==='task-edit')taskForm(state.tasks.find(t=>t.id===b.dataset.id));if(a==='task-toggle')toggleTask(b.dataset.id);if(a==='task-delete'&&confirm('Удалить задачу?')){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.id);save();closeModal();render();toast('Задача удалена')}if(a==='sub-toggle'){const t=state.tasks.find(t=>t.id===b.dataset.id),s=t?.subtasks?.[Number(b.dataset.index)];if(s){s.done=!s.done;save();taskForm(t)}}if(a==='habit-new')habitForm();if(a==='habit-toggle'){const h=state.habits.find(h=>h.id===b.dataset.id);if(h){h.history[today()]=!h.history[today()];save();tap('success');render()}}if(a==='habit-delete'&&confirm('Удалить привычку?')){state.habits=state.habits.filter(h=>h.id!==b.dataset.id);save();render();toast('Привычка удалена')}if(a==='close')closeModal();if(a==='ai-plan')aiPlan();if(a==='apply-plan')applyPlan();if(a==='import-ai')importAI();if(a==='ai-breakdown')breakdown(b.dataset.id);if(a==='apply-breakdown')applyBreakdown(b.dataset.id);if(a==='seed-demo')seedDemo();if(a==='select-focus'){state.timer.taskId=b.dataset.id;state.timer.running=false;state.timer.remaining=state.timer.duration*60;save();if(b.dataset.go)view=b.dataset.go;render();scrollTo(0,0)}if(a==='timer-toggle')startTimer();if(a==='timer-reset'){state.timer.running=false;state.timer.remaining=state.timer.duration*60;state.timer.endsAt=0;save();render()}if(a==='timer-preset'){state.timer.duration=Number(b.dataset.min);state.timer.remaining=state.timer.duration*60;save();render()}if(a==='complete-focus'){const t=focusTask();if(t)toggleTask(t.id,true)}if(a==='settings')settings();if(a==='save-settings'){state.settings.dayStart=$('#day-start').value||'09:00';state.settings.dayEnd=$('#day-end').value||'20:00';save();closeModal();toast('Настройки сохранены')}if(a==='export-data')exportData();if(a==='import-data')$('#import-file').click();if(a==='clear-data'&&confirm('Удалить все локальные данные?')){state=blank();save();render();toast('Данные очищены')}});
    $('#import-file').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''});$('#modal-root').addEventListener('click',e=>{if(e.target.classList.contains('modal'))closeModal()});
    fetch('/health').then(r=>r.json()).then(x=>{aiHealth=x;render()}).catch(()=>render());render();const capture=new URLSearchParams(location.search).get('capture');if(capture){history.replaceState(null,'',location.pathname);setTimeout(()=>captureAI(capture),350)}
  </script>
