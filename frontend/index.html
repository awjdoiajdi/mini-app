    function inboxView(){let list=[...state.tasks].sort(sortTask);if(activeTaskFilter==='today')list=list.filter(t=>t.date===today());if(activeTaskFilter==='done')list=list.filter(t=>t.done);if(activeTaskFilter==='open')list=list.filter(t=>!t.done);const tt=todayTasks(),dt=tt.filter(t=>t.done).length,prog=tt.length?Math.round(dt/tt.length*100):0;let body;const isDoneFilter=activeTaskFilter==='done';if(activeTaskFilter==='today'||activeTaskFilter==='open'){const todayList=list.filter(t=>t.date===today()&&!t.done),tomorrowList=list.filter(t=>t.date===addDays(today(),1)&&!t.done),laterList=list.filter(t=>t.date>addDays(today(),1)&&!t.done),overdueList=list.filter(t=>t.date<today()&&!t.done);body=`${groupSection('Просрочены',overdueList)}${groupSection('Сегодня',todayList)}${groupSection('Завтра',tomorrowList)}${groupSection('Позже',laterList)}`}else if(isDoneFilter){const archived=list.filter(t=>day(new Date(t.completedAt||t.createdAt))!==today());const todayDone=list.filter(t=>day(new Date(t.completedAt||t.createdAt))===today());body=`${todayDone.length?`<div class="date-group"><div class="date-group-head"><h3>Сегодня</h3><span>${todayDone.length}</span></div>${todayDone.map(taskHTML).join('')}</div>`:''}<button class="archive-toggle ${archivedOpen?'open':''}" data-action="archive-toggle"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>Архив · ${archived.length}</button>${archivedOpen&&archived.length?`<div class="task-list">${archived.map(taskHTML).join('')}</div>`:''}`}else{body=`<div class="task-list">${list.length?list.map(taskHTML).join(''):''}</div>`}const showEmpty=!list.length||(!isDoneFilter&&(activeTaskFilter!=='all')&&!list.some(t=>!t.done));return`<section class="page"><div class="page-head"><div><h1>Задачи</h1><p>${openTasks().length} открытых</p></div><button class="add" data-action="task-new" aria-label="Новая задача">+</button></div>${!isDoneFilter&&tt.length?`<div class="day-progress"><div class="day-progress-top"><b>${dt} из ${tt.length}</b><s     function cookSteps(id){const r=state.recipes.find(x=>x.id===id);if(!r)return;openModal(`<div class="sheet-head"><div><span>Режим готовки</span><h2>${esc(r.title)}</h2></div><button class="close" data-action="close">×</button></div><div class="result-list">${(r.steps.length?r.steps:['Подготовь продукты','Готовь по базовому рецепту','Попробуй и поправь соль']).map((s,i)=>`<div class="cook-step"><b>Шаг ${i+1}</b><p style="margin-top:6px;color:var(--muted);line-height:1.45">${esc(s)}</p></div>`).join('')}</div><button class="secondary" style="width:100%;margin-top:12px" data-mode="food">Спросить замену продукта</button>`)}
    function taskForm(t={}){editing=t.id||null;const v={title:'',notes:'',date:today(),time:'',duration:30,category:'Личное',priority:'medium',...t};openModal(`<div class="sheet-head"><div><span>${editing?'Редактирование':'Новая задача'}</span><h2>Задача</h2></div><button class="close" data-action="close">×</button></div><form id="task-form"><div class="field"><label>Название</label><input class="input" id="task-title" maxlength="120" required value="${esc(v.title)}" placeholder="Что сделать?"></div><div class="field"><label>Контекст</label><textarea class="input" id="task-notes" maxlength="900" placeholder="Детали, ссылки, критерий готовности">${esc(v.notes)}</textarea></div><div class="form-grid"><div class="field"><label>Дата</label><input class="input" id="task-date" type="date" value="${esc(v.date)}"></div><div class="field"><label>Время</label><input class="input" id="task-time" type="time" value="${esc(v.time)}"></div></div><div class="form-grid"><div class="field"><label>Минуты</label><input class="input" id="task-duration" type="number" min="5" max="480" step="5" value="${v.duration}"></div><div class="field"><label>Категория</label><select class="input" id="task-category">${CATS.map(c=>`<option ${v.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label>Приоритет</label><select class="input" id="task-priority">${Object.entries(PR).map(([k,l])=>`<option value="${k}" ${v.priority===k?'selected':''}>${l}</option>`).join('')}</select></div><button class="primary" style="width:100%;margin-top:8px" type="submit">Сохранить</button>${editing?`<button class="danger" style="width:100%;margin-top:10px" type="button" data-action="task-delete" data-id="${esc(editing)}">Удалить</button>`:''}</form>`)}
    function taskQuickActions(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;openModal(`<div class="sheet-head"><div><span>Задача</span><h2 style="font-size:17px;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">${esc(t.title)}</h2></div><button class="close" data-action="close">×</button></div><div class="quick-actions-sheet"><button data-action="task-edit" data-id="${esc(id)}"><svg viewBox="0 0 24 24"><path d="M11 4H4v16h16v-7M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>Редактировать</button><button data-action="task-tomorrow" data-id="${esc(id)}"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>На завтра</button><button data-action="task-duplicate" data-id="${esc(id)}"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Дублировать</button><button class="danger-text" data-action="task-delete" data-id="${esc(id)}"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Удалить</button></div>`)}
    function saveTask(){const title=$('#task-title').value.trim();if(!title)return toast('Назови задачу');const old=state.tasks.find(t=>t.id===editing),task=normalizeTask({id:old?.id,title,notes:$('#task-notes').value.trim(),date:$('#task-date').value||today(),time:$('#task-time').value,duration:$('#task-duration').value,category:$('#task-category').value,priority:$('#task-priority').value,source:old?.source||'manual',done:old?.done,createdAt:old?.createdAt,completedAt:old?.completedAt,subtasks:old?.subtasks||[]});if(old)state.tasks[state.tasks.indexOf(old)]=task;else state.tasks.unshift(task);save();closeModal();tap('success');toast(old?'Обновлено':'Создано');render()}
    function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?Date.now():null;save();tap(t.done?'success':'select');render()}
    function addMemory(){openModal(`<div class="sheet-head"><div><span>Память</span><h2>Правила для AI</h2></div><button class="close" data-action="close">×</button></div>${state.memory.notes.length?`<div class="result-list">${state.memory.notes.map((x,i)=>`<div class="result-row"><b>${i+1}</b><span>${esc(x)}</span></div>`).join('')}</div>`:''}<form id="memory-form" style="margin-top:14px"><div class="field"><label>Новое правило</label><textarea class="input" id="memory-text" maxlength="300" placeholder="Например: вечером не ставить тяжёлые задачи"></textarea></div><button class="primary" style="width:100%">Сохранить</button></form>`)}
    function saveMemory(){const x=$('#memory-text').value.trim();if(!x)return;state.memory.notes.unshift(x);state.memory.notes=state.memory.notes.slice(0,20);save();closeModal();toast('Запомнил');render()}
    function settings(){openModal(`<div class="sheet-head"><div><span>Настройки</span><h2>DailyOS</h2></div><button class="close" data-action="close">×</button></div><form id="settings-form"><div class="field"><label>Энергия сегодня</label><select class="input" id="set-energy"><option value="low" ${state.memory.energy==='low'?'selected':''}>Мало</option><option value="medium" ${state.memory.energy==='medium'?'selected':''}>Нормально</option><option value="high" ${state.memory.energy==='high'?'selected':''}>Много</option></select></div><div class="field"><label>Рабочее время</label><input class="input" id="set-hours" value="${esc(state.memory.hours)}" placeholder="09:00-20:00"></div><button class="primary" style="width:100%">Сохранить</button></form>`)}
    function saveSettings(){state.memory.energy=$('#set-energy').value;state.memory.hours=$('#set-hours').value.trim().slice(0,40)||'09:00-20:00';save();closeModal();toast('Настройки сохранены');render()}
    function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dailyos-data.json';a.click();URL.revokeObjectURL(a.href)}
    function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state=revive(JSON.parse(r.result));save();render();toast('Импорт готов')}catch(_){toast('Файл не похож на DailyOS')}};r.readAsText(file)}
    async function bootCapture(){const p=new URLSearchParams(location.search),id=p.get('capture_id'),old=p.get('capture');if(old){captureAI(old,'telegram');history.replaceState(null,'','/');return}if(!id)return;try{const r=await api(`/api/capture/${encodeURIComponent(id)}`,{headers:{'X-Telegram-Init-Data':TG?.initData||''}});if(!r.ok)throw new Error(await r.text());const data=await r.json();history.replaceState(null,'','/');captureAI(data.text,'telegram')}catch(e){toast(e.message)}}
    document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const x=$('#chat-text');sendChat(x.value);x.value=''}if(e.target.id==='capture-form'){e.preventDefault();captureAI($('#capture-text').value,'manual')}if(e.target.id==='food-form'){e.preventDefault();cookText($('#food-text').value)}if(e.target.id==='task-form'){e.preventDefault();saveTask()}if(e.target.id==='memory-form'){e.preventDefault();saveMemory()}if(e.target.id==='settings-form'){e.preventDefault();saveSettings()}});
    function taskTomorrow(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.date=addDays(today(),1);save();closeModal();tap('success');toast('Перенесено на завтра','success');render()}
    function taskDuplicate(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;state.tasks.unshift(normalizeTask({...t,id:undefined,title:`${t.title} (копия)`,createdAt:Date.now(),done:false,completedAt:null}));save();closeModal();tap('success');toast('Дублировано','success');render()}
    let pressTimer=null,pressTarget=null;
    document.addEventListener('touchstart',e=>{const tm=e.target.closest('.task-main');if(!tm)return;pressTarget=tm;pressTimer=setTimeout(()=>{pressTimer=null;const id=tm.dataset.id;if(id){tap();taskQuickActions(id)}},500)},{passive:true});
    document.addEventListener('touchend',e=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null}});
    document.addEventListener('touchmove',e=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null}},{passive:true});
    document.addEventListener('contextmenu',e=>{const tm=e.target.closest('.task-main');if(tm){e.preventDefault();const id=tm.dataset.id;if(id)taskQuickActions(id)}});
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(b.dataset.view){view=b.dataset.view;tap();render();scrollTo(0,0)}if(b.dataset.mode){tap();startMode(b.dataset.mode)}if(b.dataset.thread){state.activeThread=b.dataset.thread;view='home';save();render()}if(a==='new-chat'){const t=thread('today','Новый чат','Чем помочь?');state.threads.unshift(t);state.activeThread=t.id;save();render()}if(a==='finish-onboarding'){hideOnboarding();tap('success')}if(a==='close')closeModal();if(a==='archive-toggle'){archivedOpen=!archivedOpen;render()}if(a==='task-new')taskForm();if(a==='task-edit')taskForm(state.tasks.find(t=>t.id===b.dataset.id));if(a==='task-toggle')toggleTask(b.dataset.id);if(a==='task-tomorrow')taskTomorrow(b.dataset.id);if(a==='task-duplicate')taskDuplicate(b.dataset.id);if(a==='task-delete'){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.id);save();closeModal();tap('warning');toast('Удалено','warning');render()}if(a==='import-msg-tasks')importMsgTasks(b.dataset.id);if(a==='save-msg-recipe')saveMsgRecipe(b.dataset.id);if(a==='apply-msg-plan')applyMsgPlan(b.dataset.id);if(a==='import-ai')importAI(b.dataset.source);if(a==='food-photo')$('#food-photo').click();if(a==='save-recipe')saveRecipe(b.dataset.index);if(a==='cook')cookSteps(b.dataset.id);if(a==='memory-add')addMemory();if(a==='settings')settings();if(a==='export-data')exportData();if(a==='import-data')$('#import-file').click();if(a==='clear-data'&&confirm('Удалить локальные данные DailyOS?')){localStorage.removeItem(KEY);localStorage.removeItem(ONBOARDED_KEY);state=blank();save();render()}});
    document.addEventListener('change',e=>{if(e.target.id==='import-file')importData(e.target.files[0]);if(e.target.id==='food-photo')cookPhoto(e.target.files[0]);if(e.target.dataset.filter){activeTaskFilter=e.target.dataset.filter;render()}});
    document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){activeTaskFilter=f.dataset.filter;render()}});
     document.addEventListener('click',e=>{const b=e.target.closest('[data-action="copy-code"]');if(!b)return;const code=b.closest('.code-block')?.querySelector('pre')?.textContent||'',done=()=>toast('Код скопирован','success');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).then(done).catch(()=>toast('Не удалось скопировать код'));else{const x=document.createElement('textarea');x.value=code;document.body.append(x);x.select();document.execCommand('copy');x.remove();done()}});
     render();if(view==='home')requestAnimationFrame(mind);bootCloud();bootCapture();
  </script>
</body>
</html>
