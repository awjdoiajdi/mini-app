    .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.privacy{display:flex;gap:14px;align-items:flex-start}.seal{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;background:rgba(214,186,117,.12);border:1px solid var(--line2);color:var(--gold2);font-weight:900}.modal{position:fixed;inset:0;z-index:90;display:grid;align-items:end;background:rgba(0,0,0,.58);backdrop-filter:blur(10px)}.sheet{width:min(100%,760px);max-height:88dvh;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;border-radius:32px 32px 0 0;background:#0b0c12;border:1px solid var(--line);padding:12px 16px calc(22px + var(--safe));box-shadow:0 -30px 90px rgba(0,0,0,.58)}.handle{width:48px;height:5px;margin:0 auto 14px;border-radius:99px;background:#2b2f3a}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.sheet-head span{display:block;color:var(--gold2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}.sheet-head h2{font-size:28px;letter-spacing:-.05em}.close{width:44px;height:44px;border-radius:16px;background:rgba(255,255,255,.07);font-size:24px;font-weight:800}.field{display:grid;gap:8px;margin-bottom:12px}.field label{color:var(--soft);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}.input{min-height:50px;padding:13px 15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.subtasks,.result,.result-list{display:grid;gap:9px}.subtask,.result-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:11px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid var(--line)}.subtask button{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:900}.subtask.done span{text-decoration:line-through;color:var(--muted)}.result p,.result-row span{color:var(--muted);line-height:1.4}.loading{d <body>
  <div class="app">
    <header class="top"><div class="brand"><div class="logo">D</div><div><b>DailyOS</b><span><i></i><em id="sync-status">local first</em></span></div></div><button class="profile" id="avatar" data-action="settings" aria-label="Профиль">D</button></header>
    <main id="view"></main>
  </div>
  <button class="fab" data-action="task-new" aria-label="Новая задача">+</button>
  <nav class="nav" aria-label="Навигация">
    <button class="active" data-view="home"><b>◆</b><span>День</span></button>
    <button data-view="inbox"><b>AI</b><span>Инбокс</span></button>
    <button data-view="chaos"><b>≋</b><span>Хаос</span></button>
    <button data-view="focus"><b>◌</b><span>Фокус</span></button>
    <button data-view="report"><b>▥</b><span>Итог</span></button>
  </nav>
  <div id="modal-root"></div><div id="toast" class="toast" role="status"></div><input id="import-file" class="hidden" type="file" accept="application/json">
  <script>
    const TG=window.Telegram?.WebApp;TG?.ready();TG?.expand();TG?.setHeaderColor?.('#050507');TG?.setBackgroundColor?.('#050507');
    const USER=TG?.initDataUnsafe?.user,USER_ID=String(USER?.id||'guest'),KEY=`dailyos.black.v4.${USER_ID}`;
    const CATS=['Работа','Личное','Здоровье','Учёба','Дом','Другое'],PR={high:'Высокий',medium:'Средний',low:'Низкий'},EN={high:'Много',medium:'Нормально',low:'Мало'},RE={none:'Нет',daily:'Каждый день',weekdays:'Будни',weekly:'Неделя'};
    let view='home',filter='all',query='',editing=null,aiResult=null,aiHealth={ai:false,provider:'groq'},sync='local',toastTimer,timerTick;
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`,day=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>day();
    const addDays=(date,n)=>{const d=new Date(`${date}T12:00:00`);d.setDate(d.getDate()+n);return day(d)},fmt=date=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(`${date}T12:00:00`)),dateTitle=date=>date===today()?'Сегодня':date===addDays(today(),1)?'Завтра':date<today()?'Просрочено':new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric',month:'short'}).format(new Date(`${date}T12:00:00`));
    const blank=()=>({version:4,tasks:[],sessions:[],settings:{dayStart:'09:00',dayEnd:'20:00',energy:'medium'},demo:false,timer:{taskId:null,duration:25,remaining:1500,running:false,endsAt:0},review:null});
    function normalizeTask(t={}){const category=t.category||t.area;return{id:t.id||uid(),title:String(t.title||t.name||'Новая задача').slice(0,120),notes:t.notes||t.why||'',date:/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')?t.date:today(),time:/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time||'')?t.time:'',duration:Math.min(480,Math.max(5,Number(t.duration)||30)),category:CATS.includes(category)?category:'Личное',project:String(t.project||'').slice(0,60),priority:PR[t.priority]?t.priority:'medium',energy:EN[t.energy]?t.energy:'medium',repeat:RE[t.repeat||t.recurrence]?t.repeat||t.recurrence:'none',source:t.source||'manual',done:Boolean(t.done),createdAt:t.createdAt||Date.now(),completedAt:t.completedAt||null,spawned:Boolean(t.spawned),subtasks:Array.isArray(t.subtasks)?t.subtasks.map(s=>typeof s==='string'?{id:uid(),title:s,done:false,duration:10}:{id:s.id||uid(),title:String(s.title||'').slice(0,120),done:Boolean(s.done),duration:Number(s.duration)||10}).filter(s=>s.title):[]}}
    function revive(d){const base=blank();return{...base,...d,version:4,tasks:(d.tasks||[]).map(normalizeTask),sessions:(d.sessions||[]).filter(s=>s&&s.date).map(s=>({id:s.id||uid(),taskId:s.taskId||s.missionId||null,date:s.date,minutes:Number(s.minutes)||0,finishedAt:s.finishedAt||Date.now()})),settings:{...base.settings,...d.settings},timer:{...base.timer,...d.timer}}}
    function readJSON(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}}

<div class="field"><label>Приоритет</label><select class="input" id="task-priority">${Object.entries(PR).map(([k,l])=>`<option value="${k}" ${v.priority===k?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Энергия</label><select class="input" id="task-energy">${Object.entries(EN).map(([k,l])=>`<option value="${k}" ${v.energy===k?'selected':''}>${l}</option>`).join('')}</select></div></div>${editing?taskExtras(v):''}<button class="primary" style="width:100%;margin-top:4px" type="submit">Сохранить</button></form>`)}
    function taskExtras(t){return`<div class="section"><h2>Первый шаг</h2><button type="button" class="link" data-action="ai-breakdown" data-id="${esc(t.id)}">AI-шаги</button></div><div class="subtasks">${t.subtasks?.length?t.subtasks.map((s,i)=>`<div class="subtask ${s.done?'done':''}"><button type="button" data-action="sub-toggle" data-id="${esc(t.id)}" data-index="${i}">✓</button><span>${esc(s.title)}</span><small>${Number(s.duration)||10} мин</small></div>`).join(''):empty('Шагов нет','Нажми AI-шаги, чтобы получить старт на 5-15 минут.')}</div><button type="button" class="danger" style="width:100%;margin-bottom:10px" data-action="task-delete" data-id="${esc(t.id)}">Удалить задачу</button>`}
    function saveTask(){const title=$('#task-title').value.trim();if(!title)return toast('Назови задачу');const old=state.tasks.find(t=>t.id===editing),task=normalizeTask({id:old?.id,title,notes:$('#task-notes').value.trim(),date:$('#task-date').value||today(),time:$('#task-time').value,duration:$('#task-duration').value,category:$('#task-category').value,project:$('#task-project').value.trim(),priority:$('#task-priority').value,energy:$('#task-energy').value,repeat:$('#task-repeat').value,source:old?.source||'manual',done:old?.done,createdAt:old?.createdAt,completedAt:old?.completedAt,spawned:old?.spawned,subtasks:old?.subtasks||[]});if(old)state.tasks[state.tasks.indexOf(old)]=task;else state.tasks.unshift(task);save();closeModal();tap('success');toast(old?'Задача обновлена':'Задача создана');render()}
    function toggleTask(id,force){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=force??!t.done;t.completedAt=t.done?Date.now():null;if(t.done&&t.repeat!=='none'&&!t.spawned){t.spawned=true;state.tasks.push({...t,id:uid(),date:nextRepeat(t.date,t.repeat),done:false,completedAt:null,spawned:false,subtasks:t.subtasks.map(s=>({...s,done:false}))})}save();tap(t.done?'success':'select');render()}
    async function callAI(action,payload){if(!TG?.initData)throw new Error('AI работает внутри Telegram Mini App');const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':TG.initData},body:JSON.stringify({action,payload})});if(!r.ok)throw new Error(await r.text()||'AI недоступен');return(await r.json()).result}
    function loading(title,text){openModal(`<div class="sheet-head"><div><span>DailyOS AI</span><h2>${esc(title)}</h2></div><button type="button" class="close" data-action="close">×</button></div><div class="loading"><div class="loader"></div>${esc(text)}</div>`)}
    async function aiPlan(){const list=openTasks().slice(0,30);if(!list.length)return toast('Нет задач для плана');loading('AI-план','Собираю расписание по времени и энергии...');try{aiResult=await callAI('plan',{date:today(),now:new Date().toTimeString().slice(0,5),dayStart:state.settings.dayStart,dayEnd:state.settings.dayEnd,tasks:list.map(t=>({taskId:t.id,title:t.title,date:t.date,time:t.time,duration:t.duration,priority:t.priority,energy:t.energy,category:t.category}))});const schedule=Array.isArray(aiResult.schedule)?aiResult.schedule:[];openModal(`<div class="sheet-head"><div><span>Расписание</span><h2>AI-план</h2></div><button type="button" class="close" data-action="close">×</button></div><div class="result"><b>${esc(aiResult.summary||'План готов')}</b><p>${esc(aiResult.advice||'')}</p><div class="result-list">${schedule.map(x=>{const t=state.tasks.find(t=>t.id===x.taskId);return t?`<div class="result-row"><strong>${esc(x.start||'')}</strong><span><b>${esc(t.title)}</b><br>${esc(x.reason||'')}</span><i></i></div>`:''}).join('')}</div></div><button class="primary" style="width:100%;margin-top:12px" data-action="apply-plan">Применить время</button>`)}catch(e){closeModal();toast(e.message)}}
    function applyPlan(){for(const x of aiResult?.schedule||[]){const t=state.tasks.find(t=>t.id===x.taskId);if(t&&/^([01]\d|2[0-3]):[0-5]\d$/.test(x.start||'')){t.time=x.start;t.date=today()}}save();closeModal();tap('success');toast('План применён');render()}
    async function captureAI(text,source='text'){text=text.trim();if(!text)return toast('Нет текста для разбора');loading('AI-разбор','Достаю задачи, даты и приоритеты...');try{aiResult=await callAI('capture',{text,today:today(),currentTime:new Date().toTimeString().slice(0,5)});const tasks=Array.isArray(aiResult.tasks)?aiResult.tasks.slice(0,14):[];openModal(`<div class="sheet-head"><div><span>AI-разбор</span><h2>Подтверди задачи</h2></div><button type="button" class="close" data-action="close">×</button></div><div class="result"><b>${esc(aiResult.message||`Найдено: ${tasks.length}`)}</b><div class="result-list">${tasks.map((t,i)=>`<label class="result-row"><input type="checkbox" data-ai-task="${i}" checked><span><b>${esc(t.title)}</b><br>${esc(t.date||today())} · ${Number(t.duration)||30} мин · ${esc(PR[t.priority]||PR.medium)}</span><i></i></label>`).join('')}</div></div><button class="primary" style="width:100%;margin-top:12px" data-action="import-ai" data-source="${esc(source)}">Добавить выбранное</button>`)}catch(e){closeModal();toast(e.message)}}
    function importAI(source='AI'){const selected=$$('[data-ai-task]:checked').map(i=>aiResult.tasks[Number(i.dataset.aiTask)]);for(const t of selected)state.tasks.unshift(normalizeTask({title:String(t.title||'Новая задача').slice(0,120),date:/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')?t.date:today(),time:/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time||'')?t.time:'',duration:t.duration,priority:t.priority,energy:t.energy,category:CATS.includes(t.category)?t.category:'Личное',source}));save();closeModal();tap('success');toast(`Добавлено: ${selected.length}`);render()}
    async function breakdown(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;loading('Первый шаг','Режу задачу до коротких действий...');try{aiResult=await callAI('breakdown',{title:t.title,notes:t.notes,duration:t.duration,category:t.category});const subs=Array.isArray(aiResult.subtasks)?aiResult.subtasks.slice(0,8):[];openModal(`<div class="sheet-head"><div><span>Анти-прокрастинация</span><h2>AI-шаги</h2></div><button type="button" class="close" data-action="close">×</button></div><div class="result"><b>${esc(aiResult.summary||t.title)}</b><p>Первый шаг: ${esc(aiResult.firstStep||subs[0]?.title||'')}</p><div class="result-list">${subs.map((s,i)=>`<div class="result-row"><strong>${i+1}</strong><span><b>${esc(s.title)}</b><br>${Number(s.duration)||10} мин</span><i></i></div>`).join('')}</div></div><button class="primary" style="width:100%;margin-top:12px" data-action="apply-breakdown" data-id="${esc(id)}">Добавить шаги</button>`)}catch(e){closeModal();toast(e.message)}}
    function applyBreakdown(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.subtasks=(aiResult?.subtasks||[]).slice(0,8).map(s=>({id:uid(),title:String(s.title||'').slice(0,120),duration:Number(s.duration)||10,done:false})).filter(s=>s.title);save();closeModal();tap('success');render()}
    async function aiReview(){loading('Итог дня','Собираю честный отчёт...');try{state.review=await callAI('review',{date:today(),done:doneToday().map(t=>t.title),open:openTasks().slice(0,20).map(t=>({title:t.title,date:t.date,priority:t.priority})),focusMinutes:state.sessions.filter(s=>s.date===today()).reduce((a,s)=>a+s.minutes,0)});save();closeModal();tap('success');view='report';render()}catch(e){closeModal();toast(e.message)}}
    function seedDemo(){state=blank();state.demo=true;state.tasks=[{title:'Разобрать голосовое от заказчика',notes:'Из voice пришли правки и дедлайн до вечера',date:today(),time:'10:20',duration:25,category:'Работа',project:'Запуск',priority:'high',energy:'medium',source:'voice',subtasks:['Выписать правки','Отметить обязательное','Ответить в чат'].map(x=>({id:uid(),title:x,done:false,duration:8}))},{title:'Скрин расписания: врач в 16:30',notes:'AI достал событие из фото календаря',date:today(),time:'16:30',duration:45,category:'Здоровье',priority:'high',energy:'low',source:'screenshot'},{title:'Подготовить демо DailyOS',notes:'Показать: инбокс, что сейчас, хаос, фокус, итог',date:today(),time:'12:00',duration:50,category:'Учёба',project:'Конкурс',priority:'high',energy:'high',source:'forward'},{title:'Купить подарок',notes:'Перенесено из переписки',date:addDays(today(),1),time:'',duration:20,category:'Личное',priority:'medium',energy:'low',source:'forward'}].map(normalizeTask);state.sessions=[{id:uid(),date:addDays(today(),-1),minutes:25},{id:uid(),date:today(),minutes:25}];save();tap('success');toast('Демо загружено');render()}
    function startTimer(){const t=focusTask();if(!t)return toast('Сначала добавь задачу');if(state.timer.running){state.timer.remaining=secondsLeft();state.timer.running=false}else{state.timer.taskId=t.id;state.timer.endsAt=Date.now()+secondsLeft()*1000;state.timer.running=true}save();render()}function finishTimer(){state.sessions.push({id:uid(),taskId:state.timer.taskId,date:today(),minutes:state.timer.duration,finishedAt:Date.now()});state.timer.running=false;state.timer.remaining=state.timer.duration*60;state.timer.endsAt=0;save();tap('success');toast(`Фокус ${state.timer.duration} мин завершён`);render()}function tickTimer(){const s=secondsLeft(),n=$('#timer');if(n)n.textContent=fmtTimer(s);if(s<=0&&state.timer.running)finishTimer()}
    function settings(){openModal(`<div class="sheet-head"><div><span>Профиль</span><h2>Настройки</h2></div><button type="button" class="close" data-action="close">×</button></div><div class="form-grid"><div class="field"><label>Начало дня</label><input class="input" id="day-start" type="time" value="${esc(state.settings.dayStart)}"></div><div class="field"><label>Конец дня</label><input class="input" id="day-end" type="time" value="${esc(state.settings.dayEnd)}"></div></div><div class="field"><label>Энергия сейчас</label><select class="input" id="day-energy">${Object.entries(EN).map(([k,l])=>`<option value="${k}" ${state.settings.energy===k?'selected':''}>${l}</option>`).join('')}</select></div><button class="primary" style="width:100%" data-action="save-settings">Сохранить</button><section class="panel privacy" style="margin-top:12px"><div class="seal">D</div><div><h2 style="font-size:20px;letter-spacing:-.04em">${esc(USER?`${USER.first_name||''} ${USER.last_name||''}`.trim()||name():'Локальный профиль')}</h2><p class="reason">ID: ${esc(USER_ID)} · AI: ${aiHealth.ai?'подключён':'нужен GROQ_API_KEY'} · sync: ${sync}</p></div></section>`)}
    function shareReport(){const text=`DailyOS\nСегодня закрыто: ${doneToday().length}\nФокус: ${state.sessions.filter(s=>s.date===today()).reduce((a,s)=>a+s.minutes,0)} мин\nОткрыто: ${openTasks().length}`;TG?.showPopup?TG.showPopup({title:'Итог дня',message:text,buttons:[{type:'ok'}]}):navigator.clipboard?.writeText(text).then(()=>toast('Итог скопирован'))}
    function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=Object.assign(document.createElement('a'),{href:url,download:`dailyos-${USER_ID}-${today()}.json`});a.click();URL.revokeObjectURL(url);toast('JSON экспортирован')}async function importData(file){try{const d=JSON.parse(await file.text());if(!Array.isArray(d.tasks))throw Error();state=revive(d);save();closeModal();render();toast('Данные импортированы')}catch(_){toast('Неверный файл DailyOS')}}
    document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='capture-form')captureAI($('#capture-text').value,'text');if(e.target.id==='task-form')saveTask()});document.addEventListener('input',e=>{if(e.target.id==='task-search'){query=e.target.value;render();requestAnimationFrame(()=>{const i=$('#task-search');i?.focus();i?.setSelectionRange(query.length,query.length)})}});
    document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-filter],[data-action]');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();scrollTo(0,0);tap();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}const a=b.dataset.action;if(a==='task-new')taskForm();if(a==='task-edit')taskForm(state.tasks.find(t=>t.id===b.dataset.id));if(a==='task-toggle')toggleTask(b.dataset.id);if(a==='task-delete'&&confirm('Удалить задачу?')){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.id);save();closeModal();render();toast('Задача удалена')}if(a==='sub-toggle'){const t=state.tasks.find(t=>t.id===b.dataset.id),s=t?.subtasks?.[Number(b.dataset.index)];if(s){s.done=!s.done;save();taskForm(t)}}if(a==='show-now'){const n=pickNow();n?openModal(`<div class="sheet-head"><div><span>Решение</span><h2>Что сейчас?</h2></div><button type="button" class="close" data-action="close">×</button></div>${nowCard(n)}`):toast('Нет открытых задач')}if(a==='ai-plan')aiPlan();if(a==='apply-plan')applyPlan();if(a==='import-ai')importAI(b.dataset.source||'AI');if(a==='ai-breakdown')breakdown(b.dataset.id);if(a==='apply-breakdown')applyBreakdown(b.dataset.id);if(a==='ai-review')aiReview();if(a==='seed-demo')seedDemo();if(a==='move-today'||a==='move-tomorrow'){const t=state.tasks.find(t=>t.id===b.dataset.id);if(t){t.date=a==='move-today'?today():addDays(today(),1);save();render()}}if(a==='sweep-tomorrow'){for(const t of openTasks())if(t.date<today())t.date=addDays(today(),1);save();render();toast('Просроченное перенесено')}if(a==='select-focus'){state.timer.taskId=b.dataset.id;state.timer.running=false;state.timer.remaining=state.timer.duration*60;save();if(b.dataset.go)view=b.dataset.go;render();scrollTo(0,0)}if(a==='timer-toggle')startTimer();if(a==='timer-reset'){state.timer.running=false;state.timer.remaining=state.timer.duration*60;state.timer.endsAt=0;save();render()}if(a==='timer-preset'){state.timer.duration=Number(b.dataset.min);state.timer.remaining=state.timer.duration*60;save();render()}if(a==='complete-focus'){const t=focusTask();if(t)toggleTask(t.id,true)}if(a==='settings')settings();if(a==='save-settings'){state.settings.dayStart=$('#day-start').value||'09:00';state.settings.dayEnd=$('#day-end').value||'20:00';state.settings.energy=$('#day-energy').value;save();closeModal();toast('Настройки сохранены')}if(a==='share-report')shareReport();if(a==='export-data')exportData();if(a==='import-data')$('#import-file').click();if(a==='clear-data'&&confirm('Удалить все локальные данные?')){state=blank();save();render();toast('Данные очищены')}});
    async function bootCapture(){const p=new URLSearchParams(location.search),id=p.get('capture_id'),old=p.get('capture');if(id){history.replaceState(null,'',location.pathname);try{const r=await fetch(`/api/capture/${encodeURIComponent(id)}`,{headers:{'X-Telegram-Init-Data':TG?.initData||''}});if(!r.ok)throw new Error(await r.text());captureAI((await r.json()).text,'telegram')}catch(e){toast(e.message)}}else if(old){history.replaceState(null,'',location.pathname);captureAI(old,'telegram')}}
    $('#import-file').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''});$('#modal-root').addEventListener('click',e=>{if(e.target.classList.contains('modal'))closeModal()});
    fetch('/health').then(r=>r.json()).then(x=>{aiHealth=x;render()}).catch(()=>render());render();bootCloud();bootCapture();
  </script>
</body>
