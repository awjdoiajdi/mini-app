  <div id="modal-root"></div><div id="toast" class="toast" role="status"></div><input id="import-file" class="hidden" type="file" accept="application/json">

    const AREAS=['Работа','Личное','Здоровье','Учёба','Дом','Другое'],PR={high:'Критично',medium:'Важно',low:'Легко'},EN={high:'Высокая',medium:'Средняя',low:'Низкая'},RE={none:'Нет',daily:'Каждый день',weekdays:'Будни',weekly:'Неделя'};
    let screen='command',filter='all',query='',editing=null,aiResult=null,aiHealth={ai:false,provider:'groq'},toastTimer,timerTick;
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],icon=n=>`<svg aria-hidden="true"><use href="#i-${n}"></use></svg>`,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid=()=>crypto.randomUUID?.()||`${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`,day=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>day(),addDays=(date,n)=>{const d=new Date(`${date}T12:00:00`);d.setDate(d.getDate()+n);return day(d)},fmt=date=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(`${date}T12:00:00`)),dateTitle=date=>date===today()?'Сегодня':date===addDays(today(),1)?'Завтра':date<today()?'Просрочено':new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric',month:'short'}).format(new Date(`${date}T12:00:00`));
    const blank=()=>({version:1,missions:[],habits:[],sessions:[],settings:{dayStart:'09:00',dayEnd:'20:00'},timer:{missionId:null,duration:25,remaining:1500,running:false,endsAt:0},ai:{brief:null,briefAt:0},demo:false});
    function normalizeMission(t){return{ id:t.id||uid(),title:t.title||t.name||'Без названия',why:t.why||t.notes||'',date:t.date||today(),time:t.time||'',duration:Math.min(480,Math.max(5,Number(t.duration)||30)),area:AREAS.includes(t.area||t.category)?t.area||t.category:'Личное',project:t.project||'',priority:PR[t.priority]?t.priority:'medium',energy:EN[t.energy]?t.energy:'medium',repeat:RE[t.repeat||t.recurrence]?t.repeat||t.recurrence:'none',done:Boolean(t.done),createdAt:t.createdAt||Date.now(),completedAt:t.completedAt||null,subtasks:Array.isArray(t.subtasks)?t.subtasks.map(s=>({id:s.id||uid(),title:s.title||String(s),done:Boolean(s.done),duration:Number(s.duration)||10})):[],spawned:Boolean(t.spawned||t.recurrenceSpawned)}}
    function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d?.version===1&&Array.isArray(d.missions))return{...blank(),...d,settings:{...blank().settings,...d.settings},timer:{...blank().timer,...d.timer},ai:{...blank().ai,...d.ai}}}catch(_){}try{const old=JSON.parse(localStorage.getItem(`dailyos.v2.${USER_ID}`));if(old?.tasks?.length){const d=blank();d.missions=old.tasks.map(normalizeMission);return d}}catch(_){}try{const old=JSON.parse(localStorage.getItem('dailyos.tasks')||'[]');if(old.length){const d=blank();d.missions=old.map(normalizeMission);return d}}catch(_){}return blank()}
    let state=load();const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),tap=(kind='select')=>kind==='success'?TG?.HapticFeedback?.notificationOccurred?.('success'):TG?.HapticFeedback?.selectionChanged?.(),name=()=>USER?.first_name||'капитан',initial=()=>name().slice(0,1).toUpperCase();
    function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
    function sortMission(a,b){const p={high:0,medium:1,low:2};return(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99')||p[a.priority]-p[b.priority]}
    const openMissions=()=>state.missions.filter(m=>!m.done).sort(sortMission),todayMissions=()=>state.missions.filter(m=>m.date===today()),doneToday=()=>state.missions.filter(m=>m.done&&m.completedAt&&day(new Date(m.completedAt))===today()),focusMission=()=>state.missions.find(m=>m.id===state.timer.missionId&&!m.done)||openMissions().find(m=>m.date<=today())||openMissions()[0];
    function weekDays(){return Array.from({length:7},(_,i)=>addDays(today(),i-6))}function weekDone(){const ds=weekDays();return ds.map(d=>state.missions.filter(m=>m.completedAt&&day(new Date(m.completedAt))===d).length)}function streak(){const days=new Set(state.missions.filter(m=>m.completedAt).map(m=>day(new Date(m.completedAt))));let d=today(),n=0;if(!days.has(d))d=addDays(d,-1);while(days.has(d)){n++;d=addDays(d,-1)}return n}
    function nextRepeat(date,repeat){let n=addDays(date||today(),repeat==='weekly'?7:1);if(repeat==='weekdays')while([0,6].includes(new Date(`${n}T12:00:00`).getDay()))n=addDays(n,1);return n}console.assert(nextRepeat('2026-07-24','weekdays')==='2026-07-27','weekday repeat');
    function score(){const t=todayMissions(),done=t.filter(m=>m.done).length,hab=state.habits.length?state.habits.filter(h=>h.history?.[today()]).length/state.habits.length*30:0;return t.length?Math.min(100,Math.round(done/t.length*70+hab)):Math.round(hab)}
    function missionHTML(m){const subs=m.subtasks||[],sd=subs.filter(s=>s.done).length,over=!m.done&&m.date<today();return`<article class="mission ${m.done?'done':''} ${over?'overdue':''}"><button class="check" data-action="toggle-mission" data-id="${esc(m.id)}" aria-label="Готово">${icon('check')}</button><button class="mission-main" data-action="edit-mission" data-id="${esc(m.id)}"><div class="mission-title">${esc(m.title)}</div><div class="mission-meta"><span class="${m.priority}">${over?'Просрочено':PR[m.priority]}</span><i class="dot"></i><span>${esc(m.project||m.area)}</span><i class="dot"></i><span>${m.duration} мин</span>${m.repeat!=='none'?`<i class="dot"></i><span>↻ ${RE[m.repeat]}</span>`:''}</div>${subs.length?`<div class="subbar"><i style="width:${sd/subs.length*100}%"></i></div>`:''}</button><div class="timebox">${m.time?`<b>${esc(m.time)}</b>`:''}${m.date!==today()?esc(fmt(m.date)):''}</div></article>`}
    const empty=(title,text)=>`<div class="empty">${icon('spark')}<b>${esc(title)}</b>${esc(text)}</div>`;
    function onboarding(){return`<div class="onboard"><section class="panel"><h3>Пустой экран убивает первое впечатление.</h3><p>Загрузи демонстрационный день: миссии, привычки, фокус и аналитика появятся сразу. Потом удалишь одной кнопкой.</p><div class="actions"><button class="primary" data-action="seed-demo">Загрузить демо-день</button><button class="secondary" data-action="new-mission">Начать вручную</button></div></section></div>`}
    function commandView(){const t=todayMissions(),done=t.filter(m=>m.done).length,pct=score(),next=focusMission(),brief=state.ai.brief,over=openMissions().filter(m=>m.date<today()).length;return`<section class="page"><div class="hero"><div class="kicker">${icon('spark')} Command Center · ${aiHealth.ai?'AI online':'AI local/offline'}</div><h1>${new Date().getHours()<12?'Доброе утро':'Управляй'}<br><em>${esc(name())}</em></h1><p>Это не список задач. Это дневной центр принятия решений: что важно, где риск, какой следующий ход и что закрыть без суеты.</p><div class="hero-grid"><div class="score"><span>Миссии сегодня</span><b>${done}<small>/${t.length}</small></b><small>${over?`${over} просрочено`:'без критических хвостов'}</small></div><div class="score orbit"><div class="ring" style="--p:${pct*3.6}deg"><b>${pct}</b></div></div></div></div><form class="command" id="capture-form"><input id="capture-text" maxlength="700" placeholder="Напиши мысль: завтра созвон, купить подарок, 30 мин спорт"><button aria-label="Разобрать">${icon('arrow')}</button></form>${!state.demo&&!state.missions.length&&!state.habits.length?`<div class="section"><h2>Быстрый старт</h2><span>для конкурса</span></div>${onboarding()}`:''}<div class="section"><h2>AI-брифинг</h2><button class="link" data-action="ai-brief">Обновить</button></div><section class="panel brief"><div class="brief-head"><div class="orb">${icon('wand')}</div><div><b>${esc(brief?.headline||'Оператор ждёт данных')}</b><p>${esc(brief?.risk||'Добавь миссии или нажми «Обновить», чтобы получить краткий разбор дня.')}</p></div></div>${brief?`<div class="brief-tips"><div class="tip"><b>Следующий ход:</b> ${esc(brief.nextMove||'')}</div>${(brief.tips||[]).slice(0,2).map(x=>`<div class="tip">${esc(x)}</div>`).join('')}</div>`:`<button data-action="ai-brief">Собрать брифинг</button>`}</section><div class="section"><h2>Следующий ход</h2><button class="link" data-action="ai-plan">AI-план</button></div>${next?`<section class="panel next"><div     function missionsView(){let list=[...state.missions].sort(sortMission);if(filter==='today')list=list.filter(m=>m.date===today());if(filter==='overdue')list=list.filter(m=>!m.done&&m.date<today());if(filter==='week')list=list.filter(m=>m.date>=today()&&m.date<=addDays(today(),7));if(filter==='done')list=list.filter(m=>m.done);if(query)list=list.filter(m=>`${m.title} ${m.why} ${m.project}`.toLowerCase().includes(query.toLowerCase()));const groups={};for(const m of list)(groups[m.date||'Без даты']??=[]).push(m);return`<section class="page"><div class="hero"><div class="kicker">${icon('target')} Mission Control</div><h1>Не задачи.<br><em>Миссии.</em></h1><p>Каждая миссия имеет время, энергию, смысл и следующий шаг. Так день выглядит управляемым, а не бесконечным.</p></div><div class="toolbar"><label class="search">${icon('search')}<input id="mission-search" value="${esc(query)}" placeholder="Найти миссию или проект"></label><button class="square" data-action="new-mission">${icon('plus')}</button></div><div class="chips">${[['all','Все'],['today','Сегодня'],['overdue','Горит'],['week','7 дней'],['done','Готово']].map(([k,v])=>`<button class="chip ${filter===k?'active':''}" data-filter="${k}">${v}</button>`).join('')}</div>${list.length?Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([d,arr])=>`<div class="section"><h2>${d==='Без даты'?d:dateTitle(d)}</h2><span>${arr.length}</span></div><div class="mission-list">${arr.map(missionHTML).join('')}</div>`).join(''):empty('Пусто по фильтру','Смени фильтр или создай новую миссию.')}</section>`}
    function secondsLeft(){return state.timer.running?Math.max(0,Math.ceil((state.timer.endsAt-Date.now())/1000)):Math.max(0,state.timer.remaining||state.timer.duration*60)}function fmtTimer(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
    function focusView(){const m=focusMission(),sessions=state.sessions.filter(s=>s.date===today()),mins=sessions.reduce((a,s)=>a+s.minutes,0),week=state.sessions.filter(s=>s.date>=addDays(today(),-6)).reduce((a,s)=>a+s.minutes,0),queue=openMissions().slice(0,6);return`<section class="page"><div class="hero"><div class="kicker">${icon('bolt')} Deep Work</div><h1>Один экран.<br><em>Одна цель.</em></h1><p>Фокус-сессии превращают планы в доказательства работы. Никакого тайного сервера, только локальная статистика.</p></div><section class="timer-card"><div class="timer-label">${state.timer.running?'Сессия идёт':'Готов к фокусу'}</div><div class="timer" id="timer">${fmtTimer(secondsLeft())}</div><div class="focus-name">${esc(m?.title||'Сначала выбери миссию')}</div><div class="preset">${[25,50,90].map(x=>`<button class="${state.timer.duration===x?'active':''}" data-action="timer-preset" data-min="${x}" ${state.timer.running?'disabled':''}>${x} мин</button>`).join('')}</div><div class="controls"><button class="control-small" data-action="timer-reset">${icon('reset')}</button><button class="control-main" data-action="timer-toggle" ${m?'':'disabled'}>${icon(state.timer.running?'pause':'play')}</button><button class="control-small" data-action="complete-focus" ${m?'':'disabled'}>${icon('check')}</button></div></section><div class="metrics"><div class="metric"><b>${mins}</b><span>мин сегодня</span></div><div class="metric"><b>${sessions.length}</b><span>сессий</span></div><div class="metric"><b>${week}</b><span>мин за 7 дней</span></div></div><div class="section"><h2>Очередь</h2><span>${queue.length}</span></div><div class="mission-list">${queue.length?queue.map(missionHTML).join(''):empty('Очередь пуста','Добавь миссию в Mission Control.')}</div></section>`}
    function habitHTML(h){const ds=weekDays(),done=!!h.history?.[today()];return`<article class="habit ${done?'done':''}"><div class="habit-top"><div><b>${esc(h.title)}</b><span>${esc(h.area)} · серия ${habitStreak(h)} дн.</span></div><button data-action="toggle-habit" data-id="${esc(h.id)}">${icon('check')}</button></div><div class="heat">${ds.map(d=>`<i class="${h.history?.[d]?'on':''}"></i>`).join('')}</div></article>`}function habitStreak(h){let n=0,d=today();while(h.history?.[d]){n++;d=addDays(d,-1)}return n}
    function ritualsView(){return`<section class="page"><div class="hero"><div class="kicker">${icon('loop')} Ritual Engine</div><h1>Система<br><em>повторений.</em></h1><p>Привычки нужны не для красоты. Они держат базовый уровень энергии, пока миссии меняются каждый день.</p></div><div class="section"><h2>Ритуалы сегодня</h2><button class="link" data-action="new-habit">Добавить</button></div><div class="habit-grid">${state.habits.length?state.habits.map(habitHTML).join(''):empty('Ритуалов нет','Добавь 1-3 привычки: сон, движение, чтение, вода.')}</div></section>`}
    function reviewView(){const days=weekDays(),counts=weekDone(),max=Math.max(1,...counts),done=counts.reduce((a,b)=>a+b,0),created=state.missions.filter(m=>m.date>=days[0]&&m.date<=today()).length,rate=created?Math.round(done/created*100):0,focus=state.sessions.filter(s=>s.date>=days[0]).reduce((a,s)=>a+s.minutes,0);return`<section class="page"><div class="hero"><div class="kicker">${icon('chart')} Debrief</div><h1>Честный<br><em>отчёт.</em></h1><p>Без мотивационной воды: что закрыто, сколько было фокуса, где ритм просел и что переносить.</p></div><div class="metrics"><div class="metric"><b>${done}</b><span>миссий за 7 дней</span></div><div class="metric"><b>${streak()}</b><span>дней серии</span></div><div class="metric"><b>${rate}</b><span>% выполнения</span></div></div><section class="panel pad" style="margin-top:10px"><div class="section" style="margin-top:0"><h2>Ритм недели</h2><span>${focus} мин фокуса</span></div><div class="chart">${days.map((d,i)=>`<div class="bar ${d===today()?'today':''}"><i style="height:${Math.max(4,counts[i]/max*100)}%"></i><span>${new Intl.DateTimeFormat('ru-RU',{weekday:'short'}).format(new Date(`${d}T12:00:00`)).slice(0,2)}</span></div>`).join('')}</div></section><div class="section"><h2>Данные</h2><span>localStorage</span></div><div class="grid2"><button class="secondary" data-action="export-data">${icon('download')} Экспорт</button><button class="secondary" data-action="import-data">${icon('upload')} Импорт</button><button class="secondary" data-action="settings">${icon('gear')} Настройки</button><button class="secondary danger" data-action="clear-data">${icon('trash')} Очистить</button></div><section class="panel pad" style="margin-top:10px"><div class="brief-head"><div class="orb" style="background:linear-gradient(145deg,var(--green),#1f9b68)">${icon('lock')}</div><div><b>Без базы данных</b><p>Миссии, ритуалы и статистика хранятся локально на устройстве Telegram-пользователя. Сервер видит только контекст выбранного AI-запроса.</p></div></div></section></section>`}
    function render(){clearInterval(timerTick);$('#view').innerHTML={command:commandView,missions:missionsView,focus:focusView,rituals:ritualsView,review:reviewView}[screen]();$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===screen));$('#avatar').textContent=initial();$('#ai-status').textContent=aiHealth.ai?`${aiHealth.provider} online`:'local first';if(state.timer.running)timerTick=setInterval(tickTimer,1000)}
    function openModal(html){$('#modal-root').innerHTML=`<div class="modal"><section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div>${html}</section></div>`;TG?.BackButton?.show()}function closeModal(){$('#modal-root').innerHTML='';TG?.BackButton?.hide();aiResult=null}TG?.BackButton?.onClick(closeModal);
    function missionForm(m={}){editing=m.id||null;const v={title:'',why:'',date:today(),time:'',duration:30,area:'Личное',project:'',priority:'medium',energy:'medium',repeat:'none',subtasks:[],...m},projects=[...new Set(state.missions.map(x=>x.project).filter(Boolean))];openModal(`<div class="sheet-head"><h2>${editing?'Миссия':'Новая миссия'}</h2><button class="close" data-action="close">${icon('x')}</button></div><form id="mission-form"><div class="field"><label>Результат</label><input class="input" id="m-title" maxlength="120" required autofocus value="${esc(v.title)}" placeholder="Что должно быть готово?"></div><div class="field"><label>Зачем это важно</label><textarea class="input" id="m-why" maxlength="700" placeholder="Критерий готовности, ссылки, контекст">${esc(v.why)}</textarea></div><div class="form-grid"><div class="field"><label>Дата</label><input class="input" id="m-date" type="date" value="${esc(v.date)}"></div><div class="field"><label>Время</label><input class="input" id="m-time" type="time" value="${esc(v.time)}"></div></div><div class="form-grid"><div class="field"><label>Минуты</label><input class="input" id="m-duration" type="number" min="5" max="480" step="5" value="${v.duration}"></div><div class="field"><label>Сфера</label><select class="input" id="m-area">${AREAS.map(a=>`<option ${v.area===a?'selected':''}>${a}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Проект</label><input class="input" id="m-project" list="projects" maxlength="50" value="${esc(v.project)}" placeholder="Например: Конкурс"><datalist id="projects">${projects.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div><div class="field"><label>Повтор</label><select class="input" id="m-repeat">${Object.entries(RE).map(([k,l])=>`<option value="${k}" ${v.repeat===k?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="field"><label>Приоритет</label><div class="option-grid">${Object.entries(PR).map(([k,l])=>`<button type="button" class="option ${v.priority===k?'active':''}" data-pick="priority" data-value="${k}">${l}</button>`).join('')}</div><input type="hidden" id="m-priority" value="${esc(v.priority)}"></div><div class="field"><label>Энергия</label><div class="option-grid">${Object.entries(EN).map(([k,l])=>`<button type="button" class="option ${v.energy===k?'active':''}" data-pick="energy" data-value="${k}">${l}</button>`).join('')}</div><input type="hidden" id="m-energy" value="${esc(v.energy)}"></div>${editing?`<div class="field"><label>Подзадачи</label><div class="subtasks">${v.subtasks.length?v.subtasks.map(s=>`<div class="subtask ${s.done?'done':''}"><button type="button" data-action="toggle-sub" data-mission="${esc(v.id)}" data-id="${esc(s.id)}"></button><span>${esc(s.title)}</span></div>`).join(''):'<span class="meta">AI может построить маршрут выполнения.</span>'}</div><button type="button" class="secondary" data-action="ai-breakdown" data-id="${esc(v.id)}">${icon('wand')} Разбить с AI</button></div>`:''}<div class="modal-actions">${editing?`<button type="button" class="trash" data-action="delete-mission" data-id="${esc(v.id)}">${icon('trash')}</button>`:'<span></span>'}<button class="primary">${editing?'Сохранить':'Создать миссию'}</button></div></form>`)}
    function saveMission(form){const title=$('#m-title').value.trim();if(!title)return toast('Назови миссию');const old=state.missions.find(m=>m.id===editing),m={id:old?.id||uid(),title,why:$('#m-why').value.trim(),date:$('#m-date').value||today(),time:$('#m-time').value,duration:Math.min(480,Math.max(5,Number($('#m-duration').value)||30)),area:$('#m-area').value,project:$('#m-project').value.trim(),priority:$('#m-priority').value,energy:$('#m-energy').value,repeat:$('#m-repeat').value,done:old?.done||false,createdAt:old?.createdAt||Date.now(),completedAt:old?.completedAt||null,subtasks:old?.subtasks||[],spawned:old?.spawned||false};if(old)state.missions[state.missions.indexOf(old)]=m;else state.missions.unshift(m);save();closeModal();tap('success');toast(old?'Миссия обновлена':'Миссия создана');render()}
    function toggleMission(id,force){const m=state.missions.find(x=>x.id===id);if(!m)return;m.done=force??!m.done;m.completedAt=m.done?Date.now():null;if(m.done&&m.repeat!=='none'&&!m.spawned){m.spawned=true;state.missions.push({...m,id:uid(),date:nextRepeat(m.date,m.repeat),done:false,completedAt:null,spawned:false,subtasks:m.subtasks.map(s=>({...s,done:false}))})}save();tap(m.done?'success':'select');render()}
    function habitForm(){openModal(`<div class="sheet-head"><h2>Новый ритуал</h2><button class="close" data-action="close">${icon('x')}</button></div><form id="habit-form"><div class="field"><label>Ритуал</label><input class="input" id="h-title" maxlength="80" required autofocus placeholder="Например: 20 минут движения"></div><div class="field"><label>Сфера</label><select class="input" id="h-area">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select></div><button class="primary">Добавить ритуал</button></form>`)}
    function saveHabit(){const title=$('#h-title').value.trim();if(!title)return toast('Назови ритуал');state.habits.unshift({id:uid(),title,area:$('#h-area').value,createdAt:Date.now(),history:{}});save();closeModal();tap('success');render()}
    async function callAI(action,payload){if(!TG?.initData)throw new Error('AI работает внутри Telegram Mini App');const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':TG.initData},body:JSON.stringify({action,payload})});if(!r.ok)throw new Error(await r.text()||'AI недоступен');return(await r.json()).result}
    function loading(title,text){openModal(`<div class="sheet-head"><h2>${esc(title)}</h2><button class="close" data-action="close">${icon('x')}</button></div><div class="loading"><div class="loader"></div>${esc(text)}</div>`)}
    async function aiBrief(){loading('AI-брифинг','Оператор собирает картину дня...');try{state.ai.brief=await callAI('brief',{today:today(),now:new Date().toTimeString().slice(0,5),missions:openMissions().slice(0,25),habits:state.habits.map(h=>({title:h.title,doneToday:!!h.history?.[today()],streak:habitStreak(h)})),doneToday:doneToday().length});state.ai.briefAt=Date.now();save();closeModal();tap('success');render()}catch(e){closeModal();toast(e.message)}}
    async function aiPlan(){const list=openMissions().filter(m=>!m.date||m.date<=addDays(today(),2)).slice(0,30);if(!list.length)return toast('Нет миссий для плана');loading('AI-план','Собираю реалистичный таймлайн...');try{aiResult=await callAI('plan',{date:today(),now:new Date().toTimeString().slice(0,5),dayStart:state.settings.dayStart,dayEnd:state.settings.dayEnd,tasks:list.map(m=>({taskId:m.id,title:m.title,date:m.date,time:m.time,duration:m.duration,priority:m.priority,energy:m.energy,category:m.area}))});const schedule=Array.isArray(aiResult.schedule)?aiResult.schedule:[];openModal(`<div class="sheet-head"><h2>AI-таймлайн</h2><button class="close" data-action="close">${icon('x')}</button></div><div class="result"><b>${esc(aiResult.summary||'План готов')}</b><p>${esc(aiResult.advice||'')}</p><div class="result-list">${schedule.map(x=>{const m=state.missions.find(m=>m.id===x.taskId);return m?`<div class="result-row"><strong>${esc(x.start||'')}</strong><div><strong>${esc(m.title)}</strong><span>${esc(x.reason||'')}</span></div></div>`:''}).join('')}</div></div><button class="primary" style="width:100%;margin-top:12px" data-action="apply-plan">Применить время</button>`)}catch(e){closeModal();toast(e.message)}}
    function applyPlan(){for(const x of aiResult?.schedule||[]){const m=state.missions.find(m=>m.id===x.taskId);if(m&&/^([01]\d|2[0-3]):[0-5]\d$/.test(x.start||'')){m.time=x.start;m.date=today()}}save();closeModal();tap('success');toast('План применён');render()}
    async function captureAI(text){text=text.trim();if(!text)return toast('Напиши мысль');loading('AI Inbox','Разбираю поток мыслей на действия...');try{aiResult=await callAI('capture',{text,today:today(),currentTime:new Date().toTimeString().slice(0,5)});const tasks=Array.isArray(aiResult.tasks)?aiResult.tasks.slice(0,12):[];openModal(`<div class="sheet-head"><h2>AI Inbox</h2><button class="close" data-action="close">${icon('x')}</button></div><div class="result"><b>${esc(aiResult.message||`Найдено: ${tasks.length}`)}</b><div class="result-list">${tasks.map((t,i)=>`<label class="result-row"><input type="checkbox" data-ai-task="${i}" checked><div><strong>${esc(t.title)}</strong><span>${esc(t.date||today())} · ${Number(t.duration)||30} мин · ${esc(PR[t.priority]||PR.medium)}</span></div></label>`).join('')}</div></div><button class="primary" style="width:100%;margin-top:12px" data-action="import-ai">Добавить выбранное</button>`)}catch(e){closeModal();toast(e.message)}}
    function importAI(){const selected=$$('[data-ai-task]:checked').map(i=>aiResult.tasks[Number(i.dataset.aiTask)]);for(const t of selected)state.missions.unshift(normalizeMission({title:String(t.title||'Новая миссия').slice(0,120),date:/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')?t.date:today(),time:/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time||'')?t.time:'',duration:t.duration,priority:t.priority,energy:t.energy,area:AREAS.includes(t.category)?t.category:'Личное'}));save();closeModal();tap('success');toast(`Добавлено: ${selected.length}`);render()}
    async function breakdown(id){const m=state.missions.find(x=>x.id===id);if(!m)return;loading('AI-маршрут','Разбиваю миссию на короткие шаги...');try{aiResult=await callAI('breakdown',{title:m.title,notes:m.why,duration:m.duration,category:m.area});const subs=Array.isArray(aiResult.subtasks)?aiResult.subtasks.slice(0,8):[];openModal(`<div class="sheet-head"><h2>Маршрут</h2><button class="close" data-action="close">${icon('x')}</button></div><div class="result"><b>${esc(aiResult.summary||m.title)}</b><p>Первый шаг: ${esc(aiResult.firstStep||subs[0]?.title||'')}</p><div class="result-list">${subs.map((s,i)=>`<div class="result-row"><strong>0${i+1}</strong><div><strong>${esc(s.title)}</strong><span>${Number(s.duration)||10} мин</span></div></div>`).join('')}</div></div><button class="primary" style="width:100%;margin-top:12px" data-action="apply-breakdown" data-id="${esc(id)}">Добавить шаги</button>`)}catch(e){closeModal();toast(e.message)}}
    function applyBreakdown(id){const m=state.missions.find(x=>x.id===id);if(!m)return;m.subtasks=(aiResult?.subtasks||[]).slice(0,8).map(s=>({id:uid(),title:String(s.title||'').slice(0,120),duration:Number(s.duration)||10,done:false})).filter(s=>s.title);save();closeModal();tap('success');render()}
    function seedDemo(){state=blank();state.demo=true;state.missions=[{title:'Подготовить конкурсный питч DailyOS',why:'3 минуты: проблема, решение, wow-сценарий, приватность без БД',date:today(),time:'10:30',duration:50,area:'Работа',project:'Contest',priority:'high',energy:'high',subtasks:['Сформулировать боль','Показать AI Inbox','Показать фокус и отчёт'].map(x=>({id:uid(),title:x,done:false,duration:10}))},{title:'Собрать визуальный сценарий демо',why:'Чтобы судья видел продукт, а не пустой список',date:today(),time:'12:00',duration:40,area:'Учёба',project:'Contest',priority:'high',energy:'medium'},{title:'30 минут движения без телефона',why:'Восстановить энергию перед финальным рывком',date:today(),time:'18:30',duration:30,area:'Здоровье',project:'Energy',priority:'medium',energy:'low'},{title:'Проверить Render env GROQ_API_KEY',why:'AI должен отвечать вживую',date:addDays(today(),1),time:'09:20',duration:15,area:'Работа',project:'Launch',priority:'medium',energy:'low'}].map(normalizeMission);state.habits=[{id:uid(),title:'Сон до 00:30',area:'Здоровье',history:{[addDays(today(),-2)]:true,[addDays(today(),-1)]:true}},{id:uid(),title:'20 минут обучения',area:'Учёба',history:{[addDays(today(),-1)]:true,[today()]:true}},{id:uid(),title:'Вода утром',area:'Здоровье',history:{[today()]:true}}];state.sessions=[{id:uid(),date:addDays(today(),-1),minutes:25},{id:uid(),date:today(),minutes:25}];save();tap('success');toast('Демо-день загружен');render()}
    function startTimer(){const m=focusMission();if(!m)return toast('Сначала создай миссию');if(state.timer.running){state.timer.remaining=secondsLeft();state.timer.running=false}else{state.timer.missionId=m.id;state.timer.endsAt=Date.now()+secondsLeft()*1000;state.timer.running=true}save();render()}function finishTimer(){state.sessions.push({id:uid(),missionId:state.timer.missionId,date:today(),minutes:state.timer.duration,finishedAt:Date.now()});state.timer.running=false;state.timer.remaining=state.timer.duration*60;state.timer.endsAt=0;save();tap('success');toast(`Фокус ${state.timer.duration} мин завершён`);render()}function tickTimer(){const s=secondsLeft(),n=$('#timer');if(n)n.textContent=fmtTimer(s);if(s<=0&&state.timer.running)finishTimer()}
    function settings(){openModal(`<div class="sheet-head"><h2>Настройки</h2><button class="close" data-action="close">${icon('x')}</button></div><div class="form-grid"><div class="field"><label>Начало дня</label><input class="input" id="day-start" type="time" value="${esc(state.settings.dayStart)}"></div><div class="field"><label>Конец дня</label><input class="input" id="day-end" type="time" value="${esc(state.settings.dayEnd)}"></div></div><button class="primary" style="width:100%" data-action="save-settings">Сохранить</button><section class="panel pad" style="margin-top:12px"><div class="brief-head"><div class="orb">${icon('lock')}</div><div><b>${esc(USER?`${USER.first_name||''} ${USER.last_name||''}`.trim():'Локальный профиль')}</b><p>Профиль: ${esc(USER_ID)} · AI: ${aiHealth.ai?'подключён':'нет GROQ_API_KEY в Render'}</p></div></div></section>`)}
    function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=Object.assign(document.createElement('a'),{href:url,download:`dailyos-${USER_ID}-${today()}.json`});a.click();URL.revokeObjectURL(url);toast('JSON экспортирован')}async function importData(file){try{const d=JSON.parse(await file.text());if(d?.version!==1||!Array.isArray(d.missions))throw Error();state={...blank(),...d,settings:{...blank().settings,...d.settings},timer:{...blank().timer,...d.timer},ai:{...blank().ai,...d.ai}};save();closeModal();render();toast('Данные импортированы')}catch(_){toast('Неверный файл DailyOS')}}
    document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='capture-form')captureAI($('#capture-text').value);if(e.target.id==='mission-form')saveMission(e.target);if(e.target.id==='habit-form')saveHabit()});document.addEventListener('input',e=>{if(e.target.id==='mission-search'){query=e.target.value;render();requestAnimationFrame(()=>{const i=$('#mission-search');i?.focus();i?.setSelectionRange(query.length,query.length)})}});
    document.addEventListener('click',e=>{const b=e.target.closest('button,[data-view],[data-filter]');if(!b)return;if(b.dataset.view){screen=b.dataset.view;render();scrollTo(0,0);tap();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}const a=b.dataset.action;if(a==='new-mission')missionForm();if(a==='edit-mission')missionForm(state.missions.find(m=>m.id===b.dataset.id));if(a==='close')closeModal();if(a==='toggle-mission')toggleMission(b.dataset.id);if(a==='delete-mission'&&confirm('Удалить миссию?')){state.missions=state.missions.filter(m=>m.id!==b.dataset.id);save();closeModal();render();toast('Миссия удалена')}if(a==='new-habit')habitForm();if(a==='toggle-habit'){const h=state.habits.find(h=>h.id===b.dataset.id);h.history??={};h.history[today()]=!h.history[today()];save();tap('success');render()}if(a==='ai-brief')aiBrief();if(a==='ai-plan')aiPlan();if(a==='apply-plan')applyPlan();if(a==='import-ai')importAI();if(a==='ai-breakdown')breakdown(b.dataset.id);if(a==='apply-breakdown')applyBreakdown(b.dataset.id);if(a==='seed-demo')seedDemo();if(a==='select-focus'){state.timer.missionId=b.dataset.id;state.timer.running=false;state.timer.remaining=state.timer.duration*60;save();if(b.dataset.go)screen=b.dataset.go;render()}if(a==='timer-toggle')startTimer();if(a==='timer-reset'){state.timer.running=false;state.timer.remaining=state.timer.duration*60;state.timer.endsAt=0;save();render()}if(a==='timer-preset'){state.timer.duration=Number(b.dataset.min);state.timer.remaining=state.timer.duration*60;save();render()}if(a==='complete-focus'){const m=focusMission();if(m)toggleMission(m.id,true)}if(a==='settings')settings();if(a==='save-settings'){state.settings.dayStart=$('#day-start').value||'09:00';state.settings.dayEnd=$('#day-end').value||'20:00';save();closeModal();toast('Настройки сохранены')}if(a==='export-data')exportData();if(a==='import-data')$('#import-file').click();if(a==='clear-data'&&confirm('Удалить все локальные данные?')){state=blank();save();render();toast('Данные очищены')}if(b.dataset.pick){$(`#m-${b.dataset.pick}`).value=b.dataset.value;b.parentElement.querySelectorAll('.option').forEach(x=>x.classList.toggle('active',x===b))}if(a==='toggle-sub'){const m=state.missions.find(m=>m.id===b.dataset.mission),s=m?.subtasks.find(s=>s.id===b.dataset.id);if(s){s.done=!s.done;save();missionForm(m)}}});
    $('#import-file').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''});$('#modal-root').addEventListener('click',e=>{if(e.target.classList.contains('modal'))closeModal()});fetch('/health').then(r=>r.json()).then(x=>{aiHealth=x;render()}).catch(()=>render());render();const capture=new URLSearchParams(location.search).get('capture');if(capture){history.replaceState(null,'',location.pathname);setTimeout(()=>captureAI(capture),350)}
  </script>
</body>
